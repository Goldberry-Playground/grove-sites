# DigitalOcean App Platform spec — At The Grove Nursery (atthegrovenursery.com).
#
# Apply with:
#   doctl apps create --spec infra/do/nursery.yaml
# Or update an existing app:
#   doctl apps update <APP_ID> --spec infra/do/nursery.yaml

name: grove-nursery
region: nyc

services:
  - name: nursery
    source_dir: /
    dockerfile_path: apps/nursery/Dockerfile

    github:
      repo: Goldberry-Playground/grove-sites
      branch: main
      deploy_on_push: true

    # NOTE: the nursery Dockerfile currently sets PORT=3001 (copy-paste from
    # goldberry) even though the README documents this app at 3003. See the
    # corresponding note in ggg.yaml — same follow-up applies here.
    http_port: 3001

    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    routes:
      - path: /

    envs:
      - key: TENANT_ID
        scope: RUN_AND_BUILD_TIME
        value: nursery

      - key: ODOO_URL
        scope: RUN_AND_BUILD_TIME
        value: https://odoo.gatheringatthegrove.com

      - key: ODOO_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_ME

      - key: GHOST_URL
        scope: RUN_AND_BUILD_TIME
        value: https://ghost-nursery.gatheringatthegrove.com

      - key: GHOST_CONTENT_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_ME

      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: "1"

domains:
  - domain: atthegrovenursery.com
    type: PRIMARY
    zone: atthegrovenursery.com
  - domain: www.atthegrovenursery.com
    type: ALIAS
    zone: atthegrovenursery.com

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
