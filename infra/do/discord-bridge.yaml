# DigitalOcean App Platform spec — Discord interactions endpoint
# (apps/discord-bridge/server.ts, GOL-262 Phase 1 / GOL-650).
#
# This is the always-on public HTTPS host that Discord POSTs slash-command
# interactions to. It is a tiny, zero-dependency node:http service — NOT the
# Next.js hub and NOT a standalone droplet (see GOL-650 for why). The weekly
# digest still runs as a GitHub Actions cron (discord-digest.yml); this app
# only serves the on-demand `/insights` command + Ed25519 endpoint validation.
#
# Apply with:
#   doctl apps create --spec infra/do/discord-bridge.yaml
# Or update an existing app:
#   doctl apps update <APP_ID> --spec infra/do/discord-bridge.yaml
# Validate locally:
#   doctl apps spec validate infra/do/discord-bridge.yaml
#
# Build model: DO clones the repo, runs `docker build` against
# apps/discord-bridge/Dockerfile with the monorepo root as context, and deploys
# the image. Auto-redeploys on push to main.
#
# SECRETS: the five SECRET envs below are committed as REPLACE_ME placeholders.
# The real values live in 1Password `Grove Infra` (op refs noted inline) and are
# injected only into the live app — never into git. They are set at create time
# via a runtime spec built from 1Password (see GOL-650 handoff), or in the DO UI:
# Settings -> grove-discord-bridge -> discord-bridge -> Environment Variables.
#
# HOST URL: this app has no custom domain — DO issues a managed
# https://<app>.ondigitalocean.app URL with a valid cert, which is all Discord
# needs. The Interactions Endpoint URL is https://<that-host>/interactions.

name: grove-discord-bridge
region: nyc

services:
  - name: discord-bridge
    source_dir: /
    dockerfile_path: apps/discord-bridge/Dockerfile

    github:
      repo: Goldberry-Playground/grove-sites
      branch: main
      deploy_on_push: true

    # server.ts listens here; App Platform sets PORT to match.
    http_port: 8787

    # Smallest slug — the service is a stateless node:http listener with zero
    # runtime deps. Bump only if cold-start memory pressure appears.
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    routes:
      - path: /

    envs:
      # loadConfig() requires all five at boot — the server will not start
      # without them, so Discord's PING validation fails until they are set.
      - key: BUFFER_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        # op://Goldberry Grove - Admin/Grove Infra/buffer_api_token
        value: REPLACE_ME
      - key: DISCORD_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
        # op://Goldberry Grove - Admin/Grove Infra/discord_bot_token
        value: REPLACE_ME
      - key: DISCORD_APP_ID
        scope: RUN_TIME
        type: SECRET
        # op://Goldberry Grove - Admin/Grove Infra/discord_app_id
        value: REPLACE_ME
      - key: DISCORD_PUBLIC_KEY
        scope: RUN_TIME
        type: SECRET
        # op://Goldberry Grove - Admin/Grove Infra/discord_public_key
        value: REPLACE_ME
      - key: DISCORD_WEEKLY_INSIGHTS_CHANNEL_ID
        scope: RUN_TIME
        type: SECRET
        # op://Goldberry Grove - Admin/Grove Infra/discord_insights_channel_id
        value: REPLACE_ME

alerts:
  - rule: DEPLOYMENT_FAILED
