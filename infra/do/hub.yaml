# DigitalOcean App Platform spec — Hub portal (gatheringatthegrove.com).
#
# Apply with:
#   doctl apps create --spec infra/do/hub.yaml
# Or update an existing app:
#   doctl apps update <APP_ID> --spec infra/do/hub.yaml
# Validate locally:
#   doctl apps spec validate infra/do/hub.yaml
#
# Build model: DO clones the GitHub repo, runs `docker build` against
# apps/hub/Dockerfile with the monorepo root as context, and deploys the
# resulting image. Auto-redeploys on push to main when only hub-relevant
# paths change.

name: grove-hub
region: nyc

services:
  - name: hub
    # Dockerfile + build context.
    # source_dir is the build context (monorepo root). dockerfile_path is
    # relative to that root.
    source_dir: /
    dockerfile_path: apps/hub/Dockerfile

    github:
      repo: Goldberry-Playground/grove-sites
      branch: main
      deploy_on_push: true

    # The container listens on PORT=3000 (set by the hub Dockerfile).
    http_port: 3000

    # Smallest size that comfortably runs Next 15. Bump to 1vcpu-1gb if
    # cold-start memory pressure shows up after launch.
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    routes:
      - path: /

    envs:
      # The hub fans out to every vendor's grove_headless API. V0: all three
      # tenants share one Odoo, so this is a single URL.
      - key: GROVE_ODOO_URL
        scope: RUN_AND_BUILD_TIME
        value: https://odoo.gatheringatthegrove.com

      # Ghost — village journal CMS.
      - key: HUB_GHOST_URL
        scope: RUN_AND_BUILD_TIME
        value: https://ghost.gatheringatthegrove.com

      - key: HUB_GHOST_CONTENT_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Set this in the DO UI: Settings → grove-hub → hub → Environment
        # Variables. The placeholder is rejected at runtime by ghost-client.
        value: REPLACE_ME

      # @grove/newsletter — Ghost-native opt-in capture + hub dual-write
      # (GOL-249 / GOL-333). JSON map of sender → Ghost instance; the capture
      # route (apps/hub/app/api/newsletter/subscribe) resolves this and POSTs
      # members to `${url}/members/api/send-magic-link/`. Public members
      # endpoint — no API key, so these are plain URLs, NOT a secret. Absent →
      # the route returns 503 newsletter_not_configured (safe go-live gate).
      # Production origins are the post-cutover blog.{domain} Ghost instances.
      # NOTE (2026-07-13): only the `nursery` instance has Ghost Memberships
      # enabled today (send-magic-link live); `grove`/`goldberry` return 404
      # until their Ghost admin enables members — see GOL-333. They are kept in
      # the map so they light up with no further infra change once enabled.
      - key: GHOST_NEWSLETTER_INSTANCES
        scope: RUN_AND_BUILD_TIME
        value: '{"grove":{"url":"https://blog.gatheringatthegrove.com"},"nursery":{"url":"https://blog.atthegrovenursery.com"},"goldberry":{"url":"https://blog.goldberrygrove.farm"}}'

      - key: GROVE_REVALIDATE_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Generate with: openssl rand -hex 32
        value: REPLACE_ME

      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: "1"

      # ── RUM / analytics (@grove/analytics → grove-obs OpenObserve RUM) ──────
      # NEXT_PUBLIC_* are inlined into the browser bundle at BUILD time, so they
      # must be present when `docker build` runs → RUN_AND_BUILD_TIME scope.
      # Browser-reachable ingest endpoint (public host + TLS + CORS) was stood up
      # on grove-obs by GOL-311. The SDK POSTs custom actions + web-vitals to
      # https://rum.gatheringatthegrove.com/rum/v1/default/rum (stream _rumdata).
      - key: NEXT_PUBLIC_RUM_ENABLED
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: NEXT_PUBLIC_RUM_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: NEXT_PUBLIC_OO_RUM_SITE
        scope: RUN_AND_BUILD_TIME
        value: rum.gatheringatthegrove.com
      - key: NEXT_PUBLIC_OO_RUM_CLIENT_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Browser-public by design (RUM-ingest-only, NOT an admin key). Real value:
        # op://Goldberry Grove - Admin/Grove Infra/obs_rum_client_token
        # Set in DO UI: Settings → grove-hub → hub → Environment Variables.
        value: REPLACE_ME
      - key: NEXT_PUBLIC_OO_RUM_APP_ID
        scope: RUN_AND_BUILD_TIME
        value: grove-hub
      - key: NEXT_PUBLIC_OO_RUM_SERVICE
        scope: RUN_AND_BUILD_TIME
        value: grove-hub
      - key: NEXT_PUBLIC_OO_RUM_ORG
        scope: RUN_AND_BUILD_TIME
        value: default
      - key: NEXT_PUBLIC_OO_RUM_INSECURE
        scope: RUN_AND_BUILD_TIME
        value: "false"

domains:
  - domain: gatheringatthegrove.com
    type: PRIMARY
    zone: gatheringatthegrove.com
  - domain: www.gatheringatthegrove.com
    type: ALIAS
    zone: gatheringatthegrove.com

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
