# DigitalOcean App Platform spec — GGG Woodworking (woodworkingeorge.com).
#
# Apply with:
#   doctl apps create --spec infra/do/ggg.yaml
# Or update an existing app:
#   doctl apps update <APP_ID> --spec infra/do/ggg.yaml

name: grove-ggg
region: nyc

services:
  - name: ggg
    source_dir: /
    dockerfile_path: apps/ggg/Dockerfile

    github:
      repo: Goldberry-Playground/grove-sites
      branch: main
      deploy_on_push: true

    # NOTE: the ggg Dockerfile currently sets PORT=3001 (copy-paste from
    # goldberry) even though the README documents this app at 3002. Since
    # each App Platform service runs in its own container the port collision
    # only exists locally, not in prod — but worth a follow-up cleanup PR
    # to bring the Dockerfile in line with the README.
    http_port: 3001

    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    routes:
      - path: /

    envs:
      - key: TENANT_ID
        scope: RUN_AND_BUILD_TIME
        value: ggg

      - key: ODOO_URL
        scope: RUN_AND_BUILD_TIME
        value: https://odoo.gatheringatthegrove.com

      - key: ODOO_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_ME

      - key: GHOST_URL
        scope: RUN_AND_BUILD_TIME
        value: https://ghost-ggg.gatheringatthegrove.com

      - key: GHOST_CONTENT_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_ME

      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: "1"

      # ── RUM / analytics (@grove/analytics → grove-obs OpenObserve RUM) ──────
      # NEXT_PUBLIC_* are inlined into the browser bundle at BUILD time, so they
      # must be present when `docker build` runs → RUN_AND_BUILD_TIME scope.
      # Browser-reachable ingest endpoint (public host + TLS + CORS) was stood up
      # on grove-obs by GOL-311. The SDK POSTs custom actions + web-vitals to
      # https://rum.gatheringatthegrove.com/rum/v1/default/rum (stream _rumdata).
      - key: NEXT_PUBLIC_RUM_ENABLED
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: NEXT_PUBLIC_RUM_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: NEXT_PUBLIC_OO_RUM_SITE
        scope: RUN_AND_BUILD_TIME
        value: rum.gatheringatthegrove.com
      - key: NEXT_PUBLIC_OO_RUM_CLIENT_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Browser-public by design (RUM-ingest-only, NOT an admin key). Real value:
        # op://Goldberry Grove - Admin/Grove Infra/obs_rum_client_token
        # Set in DO UI: Settings → grove-ggg → ggg → Environment Variables.
        value: REPLACE_ME
      - key: NEXT_PUBLIC_OO_RUM_APP_ID
        scope: RUN_AND_BUILD_TIME
        value: grove-ggg
      - key: NEXT_PUBLIC_OO_RUM_SERVICE
        scope: RUN_AND_BUILD_TIME
        value: grove-ggg
      - key: NEXT_PUBLIC_OO_RUM_ORG
        scope: RUN_AND_BUILD_TIME
        value: default
      - key: NEXT_PUBLIC_OO_RUM_INSECURE
        scope: RUN_AND_BUILD_TIME
        value: "false"

domains:
  - domain: woodworkingeorge.com
    type: PRIMARY
    zone: woodworkingeorge.com
  - domain: www.woodworkingeorge.com
    type: ALIAS
    zone: woodworkingeorge.com

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
