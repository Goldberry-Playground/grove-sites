# DigitalOcean App Platform spec — Goldberry Grove Farm (goldberrygrove.farm).
#
# Apply with:
#   doctl apps create --spec infra/do/goldberry.yaml
# Or update an existing app:
#   doctl apps update <APP_ID> --spec infra/do/goldberry.yaml

name: grove-goldberry
region: nyc

services:
  - name: goldberry
    source_dir: /
    dockerfile_path: apps/goldberry/Dockerfile

    github:
      repo: Goldberry-Playground/grove-sites
      branch: main
      deploy_on_push: true

    # The container listens on PORT=3001 (set by the goldberry Dockerfile).
    http_port: 3001

    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    routes:
      - path: /

    envs:
      - key: TENANT_ID
        scope: RUN_AND_BUILD_TIME
        value: goldberry

      - key: ODOO_URL
        scope: RUN_AND_BUILD_TIME
        value: https://odoo.gatheringatthegrove.com

      - key: ODOO_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Generate in Odoo: Settings → Users → [user] → API Keys.
        value: REPLACE_ME

      - key: GHOST_URL
        scope: RUN_AND_BUILD_TIME
        value: https://ghost-goldberry.gatheringatthegrove.com

      - key: GHOST_CONTENT_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Find in Ghost Admin: Settings → Integrations → [integration] →
        # Content API Key.
        value: REPLACE_ME

      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: "1"

domains:
  - domain: goldberrygrove.farm
    type: PRIMARY
    zone: goldberrygrove.farm
  - domain: www.goldberrygrove.farm
    type: ALIAS
    zone: goldberrygrove.farm

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
