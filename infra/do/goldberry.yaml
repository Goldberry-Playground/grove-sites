# DigitalOcean App Platform spec — Goldberry Grove Farm (goldberrygrove.farm).
#
# Apply with:
#   doctl apps create --spec infra/do/goldberry.yaml
# Or update an existing app:
#   doctl apps update <APP_ID> --spec infra/do/goldberry.yaml

name: grove-goldberry
region: nyc

services:
  - name: goldberry
    source_dir: /
    dockerfile_path: apps/goldberry/Dockerfile

    github:
      repo: Goldberry-Playground/grove-sites
      branch: main
      deploy_on_push: true

    # The container listens on PORT=3001 (set by the goldberry Dockerfile).
    http_port: 3001

    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    routes:
      - path: /

    envs:
      - key: TENANT_ID
        scope: RUN_AND_BUILD_TIME
        value: goldberry

      - key: ODOO_URL
        scope: RUN_AND_BUILD_TIME
        value: https://odoo.gatheringatthegrove.com

      - key: ODOO_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Generate in Odoo: Settings → Users → [user] → API Keys.
        value: REPLACE_ME

      - key: GHOST_URL
        scope: RUN_AND_BUILD_TIME
        value: https://ghost-goldberry.gatheringatthegrove.com

      - key: GHOST_CONTENT_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Find in Ghost Admin: Settings → Integrations → [integration] →
        # Content API Key.
        value: REPLACE_ME

      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: "1"

      # ── RUM / analytics (@grove/analytics → grove-obs OpenObserve RUM) ──────
      # NEXT_PUBLIC_* are inlined into the browser bundle at BUILD time, so they
      # must be present when `docker build` runs → RUN_AND_BUILD_TIME scope.
      # Browser-reachable ingest endpoint (public host + TLS + CORS) was stood up
      # on grove-obs by GOL-311. The SDK POSTs custom actions + web-vitals to
      # https://rum.gatheringatthegrove.com/rum/v1/default/rum (stream _rumdata).
      - key: NEXT_PUBLIC_RUM_ENABLED
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: NEXT_PUBLIC_RUM_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: NEXT_PUBLIC_OO_RUM_SITE
        scope: RUN_AND_BUILD_TIME
        value: rum.gatheringatthegrove.com
      - key: NEXT_PUBLIC_OO_RUM_CLIENT_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Browser-public by design (RUM-ingest-only, NOT an admin key). Real value:
        # op://Goldberry Grove - Admin/Grove Infra/obs_rum_client_token
        # Set in DO UI: Settings → grove-goldberry → goldberry → Environment Variables.
        value: REPLACE_ME
      - key: NEXT_PUBLIC_OO_RUM_APP_ID
        scope: RUN_AND_BUILD_TIME
        value: grove-goldberry
      - key: NEXT_PUBLIC_OO_RUM_SERVICE
        scope: RUN_AND_BUILD_TIME
        value: grove-goldberry
      - key: NEXT_PUBLIC_OO_RUM_ORG
        scope: RUN_AND_BUILD_TIME
        value: default
      - key: NEXT_PUBLIC_OO_RUM_INSECURE
        scope: RUN_AND_BUILD_TIME
        value: "false"

domains:
  - domain: goldberrygrove.farm
    type: PRIMARY
    zone: goldberrygrove.farm
  - domain: www.goldberrygrove.farm
    type: ALIAS
    zone: goldberrygrove.farm

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
