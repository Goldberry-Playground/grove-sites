name: dependency-review

###############################################################################
# Block PRs that introduce dependencies with known CVEs OR licenses outside
# the allowed set. Complements ci.yml's time-of-build `pnpm audit` — this
# fires at PR-time so a vulnerable dep can't land on main in the first place.
#
# Audit 2026-06-29 cross-repo top item — adds the missing pre-merge CVE gate.
# Free for public + private repos via GH-hosted dependency graph.
###############################################################################

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # to comment the dep summary on the PR

concurrency:
  group: dep-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@1e966ba708e4b64bb0c9bfb7abb5a232840be16a # v4.5.0
        with:
          fail-on-severity: high
          # GPL-3.0 + AGPL conflict with our private commercial use; flag them.
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure
