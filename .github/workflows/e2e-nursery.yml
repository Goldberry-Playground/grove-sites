name: e2e-nursery

###############################################################################
# Nursery checkout Playwright E2E acceptance suite (GOL-1074).
#
# This runs against a *deployed* nursery instance (normally a per-PR preview
# droplet from preview-up.yml), not a Playwright-bundled dev server.
#
# It is deliberately MANUAL (workflow_dispatch) and NOT a required check: it needs
# a live deployed target (a preview droplet, or the QA nursery during a release-
# train window) plus a reachable QA Odoo backend, so making it required would
# block every unrelated PR.
#
# GOL-899 LANDED: the QA droplet carries Stripe TEST keys and sessions mint as
# cs_test_, so the @stripe specs RUN BY DEFAULT (see the skip_stripe input below
# and apps/nursery/e2e/README.md). Set skip_stripe=true only for a target that
# genuinely lacks test keys. Earlier revisions of this header called GOL-899
# "currently blocked" — that is stale and contradicted the input default three
# lines down.
#
# Follow-up still open: wire this to `workflow_run` after a successful preview-up
# and read the nursery URL from the `preview-urls` artifact
# (see apps/nursery/e2e/README.md).
#
# RELEASE TRAIN: this workflow is the LAST pre-promote step. Re-dispatch it on
# `main` after the final merge AND after the QA `-u` module soak, then READ THE
# SKIP LIST in the Playwright report — a green run with the promo / WV-tax /
# Stripe-Tax specs skipped is not a pass. See odoocker
# docs/RUNBOOK-release-train.md.
###############################################################################

on:
  workflow_dispatch:
    inputs:
      base_url:
        # Defaults to the QA nursery so the release gate (e2e/README.md "QA
        # release gate") is one click; override with a preview URL to test a PR
        # droplet instead.
        description: "Deployed nursery base URL to test against (default: QA; or e.g. https://nursery.pr-123.preview...)"
        required: false
        default: "https://nursery.qa.gatheringatthegrove.com"
        type: string
      skip_stripe:
        # QA carries Stripe TEST keys (GOL-899 landed — sessions mint as
        # cs_test_), so the @stripe specs run by default. Flip to true only for
        # a target without test keys.
        description: "Exclude @stripe specs (only for a target without Stripe TEST keys)"
        required: false
        default: false
        type: boolean

concurrency:
  group: e2e-nursery-${{ github.ref }}-${{ inputs.base_url }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  e2e:
    name: Nursery checkout E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium)
        run: pnpm --filter @grove/nursery exec playwright install --with-deps chromium

      - name: Sanity — target is reachable
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE_URL" || echo 000)
          echo "GET $BASE_URL -> $code"
          if [ "$code" = "000" ]; then
            echo "::error::$BASE_URL is unreachable — is the preview droplet up? (preview-up.yml, qa label)"
            exit 1
          fi

      - name: Run Playwright suite
        env:
          CI: "true"
          E2E_NURSERY_BASE_URL: ${{ inputs.base_url }}
        run: |
          if [ "${{ inputs.skip_stripe }}" = "true" ]; then
            echo "Skipping @stripe specs (skip_stripe=true; target has no Stripe TEST keys)."
            pnpm --filter @grove/nursery run test:e2e:no-stripe
          else
            pnpm --filter @grove/nursery run test:e2e
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nursery
          path: apps/nursery/playwright-report
          retention-days: 14
          if-no-files-found: warn
