name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  no-tracked-env-files:
    name: Reject tracked .env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Single source of truth against the "real .env got committed" leak class.
      # Operator-owned .env files (.env, .env.local, .env.production, .env.grove,
      # .env.monitoring) MUST never appear in git history. Example/template files
      # are allowed (.env.example, .env.*.example, .env.grove.example, etc).
      - name: Fail if a real .env is tracked
        run: |
          tracked=$(git ls-files | grep -E "^(\.env|.*\.env)$" | grep -vE "\.example$" || true)
          if [ -n "$tracked" ]; then
            echo "::error::Real .env file(s) are tracked. Move them to .env.*.example or rotate the secrets:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env (non-example) files."

  ds-theme-drift:
    name: Design-sync theme artifacts match sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # packages/grove-ui/ds-theme.<brand>.css is a generated artifact that is
      # committed to git (the Claude Design projects consume it directly, and
      # .design-sync is one-way outbound, so it cannot be built on their side).
      # Nothing but convention kept it in step with grove-tokens + the component
      # CSS, and it had drifted ~1400 lines behind by the time GOL-380 checked.
      # Regenerating needs no install: ds-theme-gen.sh is pure concatenation.
      - name: Regenerate theme artifacts
        run: ./scripts/ds-theme-gen.sh --all

      - name: Fail if committed artifacts drifted from their sources
        run: |
          if ! git diff --quiet -- packages/grove-ui/ds-theme.*.css; then
            echo "::error::ds-theme.<brand>.css is out of date with grove-tokens / grove-ui component CSS. Run ./scripts/ds-theme-gen.sh --all and commit the result."
            git diff --stat -- packages/grove-ui/ds-theme.*.css
            echo "--- full diff ---"
            git diff -- packages/grove-ui/ds-theme.*.css
            exit 1
          fi
          echo "All four ds-theme artifacts match their sources."

  lint-and-typecheck:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint, no warnings allowed in apps)
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests (vitest)
        run: pnpm test

  featured-slug-guard:
    name: Featured slugs resolve in seeded catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GOL-440: the hub's featured row silently drops any featured[] slug that
      # doesn't resolve in the vendor's seeded catalog (this is how GOL-400's
      # empty row went unnoticed). This job resolves every featured slug against
      # the seeded QA Odoo the same way production does and fails if any returns
      # count=0. If the QA Odoo is unreachable the test skips (see the file's
      # reachability policy) so an infra outage never reds an unrelated PR — the
      # structural half of the guard still runs in the unit suite above.
      - name: Resolve featured slugs against seeded catalog
        env:
          FEATURED_SLUG_CHECK: "1"
          GROVE_ODOO_URL: ${{ vars.GROVE_QA_ODOO_URL || 'https://odoo.qa.gatheringatthegrove.com' }}
        run: pnpm exec vitest run apps/hub/data/__tests__/featured-slugs.live.test.ts

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verifies output: "standalone" actually produces a server.js — without
      # this, Dockerfile copy steps would silently fail at deploy time.
      - name: Build all apps
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          ODOO_URL: "http://localhost:8069"
          GHOST_URL: "http://localhost:2368"
          GHOST_CONTENT_KEY: "build-placeholder"
        run: pnpm build

      - name: Verify Goldberry standalone output
        run: |
          if [ ! -f "apps/goldberry/.next/standalone/apps/goldberry/server.js" ]; then
            echo "::error::Standalone server.js missing — Dockerfile would fail."
            ls -la apps/goldberry/.next/standalone/apps/goldberry/ 2>&1 || true
            exit 1
          fi
          echo "Standalone server.js present."

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Trivy replaced `pnpm audit` on 2026-07-15 (GOL-389). npm retired the
      # legacy audit endpoint that pnpm calls; it now returns HTTP 410, so
      # `pnpm audit` fails for everyone regardless of pnpm version (reproduced
      # on 9.15.0 and 10.28.2, and off-CI). Trivy reads pnpm-lock.yaml natively
      # and needs no install step, so this job no longer sets up pnpm/Node.
      #
      # Blocking as of 2026-05-19. The soft-fail period drifted — a manual audit
      # surfaced 6 HIGH Next.js CVEs (15.5.14 → ≥15.5.18) that this gate would
      # have caught if it had been blocking. If noisy, fix the noise (raise
      # severity to CRITICAL only, or add a documented .trivyignore entry with
      # an expiry) — do not flip exit-code back to 0 and do not re-soften this
      # gate. Verified on the 15.5.14 lockfile: this config reports all 6 of
      # those HIGH CVEs and exits 1.
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # `pnpm audit` scanned dev dependencies by default; Trivy suppresses
          # them unless told otherwise. Without this the gate would silently
          # scan less than the gate it replaced. Not a trivy-action input, so
          # it is set via the environment.
          TRIVY_INCLUDE_DEV_DEPS: "true"
          # Fall back to the GHCR copy if the gcr.io mirror rate-limits, so a
          # DB-download blip cannot turn this gate red for reasons unrelated
          # to our dependencies.
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: library

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # trufflehog needs full history to scan

      # gitleaks-action requires a paid license for org accounts; trufflehog
      # is still free and equivalent in coverage for our use case.
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --only-verified
