name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  no-tracked-env-files:
    name: Reject tracked .env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Single source of truth against the "real .env got committed" leak class.
      # Operator-owned .env files (.env, .env.local, .env.production, .env.grove,
      # .env.monitoring) MUST never appear in git history. Example/template files
      # are allowed (.env.example, .env.*.example, .env.grove.example, etc).
      - name: Fail if a real .env is tracked
        run: |
          tracked=$(git ls-files | grep -E "^(\.env|.*\.env)$" | grep -vE "\.example$" || true)
          if [ -n "$tracked" ]; then
            echo "::error::Real .env file(s) are tracked. Move them to .env.*.example or rotate the secrets:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env (non-example) files."

  ds-theme-drift:
    name: Design-sync theme artifacts match sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # packages/grove-ui/ds-theme.<brand>.css is a generated artifact that is
      # committed to git (the Claude Design projects consume it directly, and
      # .design-sync is one-way outbound, so it cannot be built on their side).
      # Nothing but convention kept it in step with grove-tokens + the component
      # CSS, and it had drifted ~1400 lines behind by the time GOL-380 checked.
      # Regenerating needs no install: ds-theme-gen.sh is pure concatenation.
      - name: Regenerate theme artifacts
        run: ./scripts/ds-theme-gen.sh --all

      - name: Fail if committed artifacts drifted from their sources
        run: |
          if ! git diff --quiet -- packages/grove-ui/ds-theme.*.css; then
            echo "::error::ds-theme.<brand>.css is out of date with grove-tokens / grove-ui component CSS. Run ./scripts/ds-theme-gen.sh --all and commit the result."
            git diff --stat -- packages/grove-ui/ds-theme.*.css
            echo "--- full diff ---"
            git diff -- packages/grove-ui/ds-theme.*.css
            exit 1
          fi
          echo "All four ds-theme artifacts match their sources."

  lint-and-typecheck:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint, no warnings allowed in apps)
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests (vitest)
        run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verifies output: "standalone" actually produces a server.js — without
      # this, Dockerfile copy steps would silently fail at deploy time.
      - name: Build all apps
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          ODOO_URL: "http://localhost:8069"
          GHOST_URL: "http://localhost:2368"
          GHOST_CONTENT_KEY: "build-placeholder"
        run: pnpm build

      - name: Verify Goldberry standalone output
        run: |
          if [ ! -f "apps/goldberry/.next/standalone/apps/goldberry/server.js" ]; then
            echo "::error::Standalone server.js missing — Dockerfile would fail."
            ls -la apps/goldberry/.next/standalone/apps/goldberry/ 2>&1 || true
            exit 1
          fi
          echo "Standalone server.js present."

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking as of 2026-05-19. The soft-fail period drifted — a manual audit
      # surfaced 6 HIGH Next.js CVEs (15.5.14 → ≥15.5.18) that this gate would
      # have caught if it had been blocking. If noisy, fix the noise (raise
      # --audit-level=critical, or add a documented allowlist file) — do not
      # re-soften this gate.
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # trufflehog needs full history to scan

      # gitleaks-action requires a paid license for org accounts; trufflehog
      # is still free and equivalent in coverage for our use case.
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          extra_args: --only-verified
