name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  no-tracked-env-files:
    name: Reject tracked .env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Single source of truth against the "real .env got committed" leak class.
      # Operator-owned .env files (.env, .env.local, .env.production, .env.grove,
      # .env.monitoring) MUST never appear in git history. Example/template files
      # are allowed (.env.example, .env.*.example, .env.grove.example, etc).
      - name: Fail if a real .env is tracked
        run: |
          tracked=$(git ls-files | grep -E "^(\.env|.*\.env)$" | grep -vE "\.example$" || true)
          if [ -n "$tracked" ]; then
            echo "::error::Real .env file(s) are tracked. Move them to .env.*.example or rotate the secrets:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env (non-example) files."

  lint-and-typecheck:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint, no warnings allowed in apps)
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests (vitest)
        run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verifies output: "standalone" actually produces a server.js — without
      # this, Dockerfile copy steps would silently fail at deploy time.
      - name: Build all apps
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          ODOO_URL: "http://localhost:8069"
          GHOST_URL: "http://localhost:2368"
          GHOST_CONTENT_KEY: "build-placeholder"
        run: pnpm build

      - name: Verify Goldberry standalone output
        run: |
          if [ ! -f "apps/goldberry/.next/standalone/apps/goldberry/server.js" ]; then
            echo "::error::Standalone server.js missing — Dockerfile would fail."
            ls -la apps/goldberry/.next/standalone/apps/goldberry/ 2>&1 || true
            exit 1
          fi
          echo "Standalone server.js present."

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on high/critical CVEs. Tune the level if it's too noisy.
      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true # TODO 2026-Q3: re-evaluate; flip to false after triage

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # trufflehog needs full history to scan

      # gitleaks-action requires a paid license for org accounts; trufflehog
      # is still free and equivalent in coverage for our use case.
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          extra_args: --only-verified
