name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # SHA-pinned per workflow audit 2026-06-29 (cross-repo top 8).
        # Third-party action with id-token: write — `@v1` is a mutable
        # major-version tag (Anthropic doesn't ship semver releases on
        # this repo). Pinned to the immutable commit. Renovate/Dependabot
        # should drive future bumps after review.
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1 (2025-08-26)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Our agent-authored PRs are opened by the AgenticOS broker App
          # (actor `agenticos-developer[bot]`). claude-code-action blocks
          # non-human actors by default, which failed the `claude-review`
          # check on every bot-authored PR and blocked merges (GOL-120).
          # Scope the allow-list to our own automation bot only (not `*`),
          # so third-party bots (e.g. dependabot) can't trigger paid reviews.
          allowed_bots: 'agenticos-developer'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

