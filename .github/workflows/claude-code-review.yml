name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Docs-only PRs don't need an agentic review; everything else does.
    paths-ignore:
      - "**.md"

# Each review costs a full Claude Code session (~2-6 min of Max-subscription
# capacity). `synchronize` re-reviews on every push, so rapid pushes stacked
# reviews of already-obsolete intermediate states — cancel the stale one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts get reviewed when marked ready (ready_for_review trigger above).
    # Skip Dependabot PRs: they run with GitHub's isolated Dependabot secret
    # store, so `secrets.CLAUDE_CODE_OAUTH_TOKEN` is empty and the action fails
    # to authenticate (red X on every dep bump). Dependabot is also not in
    # `allowed_bots` below, so these PRs were never meant to be Claude-reviewed.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # SHA-pinned per workflow audit 2026-06-29 (cross-repo top 8).
        # Third-party action with id-token: write — `@v1` is a mutable
        # major-version tag (Anthropic doesn't ship semver releases on
        # this repo). Pinned to the immutable commit. Renovate/Dependabot
        # should drive future bumps after review.
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1 (2025-08-26)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Paperclip agents open PRs as the AgenticOS GitHub App; the action
          # rejects non-human actors by default ("Workflow initiated by
          # non-human actor"). Allow exactly our App bot — agent-authored PRs
          # need this review MORE than human ones (D4 review-lane design).
          allowed_bots: 'agenticos-developer'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

