name: Discord register /insights command

###############################################################################
# Registers (idempotently) the `/insights` GLOBAL slash command with Discord
# (GOL-262 Phase 1, handback GOL-602). Discord's PUT /applications/{id}/commands
# is an upsert, so re-running is safe — do it whenever INSIGHTS_COMMAND changes.
#
# Trigger paths (GOL-651):
#   - workflow_dispatch     : manual run from the Actions UI (needs actions:write).
#   - repository_dispatch   : fire via POST /repos/.../dispatches with
#       {"event_type":"register-discord-commands"}. This only needs contents:write,
#       so the AgenticOS GitHub App (Terra's broker token, which lacks
#       actions:write) can trigger registration self-serve — no human click.
#
# Secrets come from 1Password via the service-account token — the bot token is
# never handled by a human or pasted into a shell, and nothing sensitive lives
# in GitHub. Only the two secrets the registration actually needs (bot token +
# app id) are pulled (least privilege).
#
# Until the 1Password service account is configured the job self-skips cleanly,
# so enabling this file on main never produces red runs.
###############################################################################

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [register-discord-commands]

permissions:
  contents: read

concurrency:
  group: discord-register-commands-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register:
    name: Register /insights command
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'Goldberry-Playground/grove-sites'
    steps:
      - name: Guard — skip until 1Password service account is configured
        id: guard
        env:
          OP_TOKEN: ${{ secrets.OP_CI_SA_TOKEN }}
        run: |
          if [ -z "$OP_TOKEN" ]; then
            echo "OP_CI_SA_TOKEN not set — Discord bridge not yet provisioned (GOL-263). Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Setup pnpm
        if: steps.guard.outputs.run == 'true'
        uses: pnpm/action-setup@v6.0.9
        with:
          version: "9.15.0"

      - name: Setup Node.js
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Load secrets from 1Password
        if: steps.guard.outputs.run == 'true'
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_SA_TOKEN }}
          DISCORD_BOT_TOKEN: "op://Goldberry Grove - Admin/Grove Infra/discord_bot_token"
          DISCORD_APP_ID: "op://Goldberry Grove - Admin/Grove Infra/discord_app_id"

      - name: Register /insights command
        if: steps.guard.outputs.run == 'true'
        run: pnpm --filter @grove/discord-bridge register-commands
