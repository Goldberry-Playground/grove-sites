name: actionlint

###############################################################################
# Lint all .github/workflows/*.yml files for shell-injection, quoting bugs,
# and schema errors. Cheap (~5s); catches the class of bugs that bit odoocker
# repeatedly (em-dashes in YAML, $$ substitution, unquoted matchers).
#
# Audit 2026-06-29 cross-repo top item #4 — also adds actionlint to odoocker
# and grove-odoo-modules in their respective PRs.
###############################################################################

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint all workflows
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
