# Missing-required-check sweep — GOL-1958.
#
# A *required* status check that never STARTS (a dropped GitHub trigger) is
# indistinguishable from one that is still running: the PR hangs at
# "Expected — waiting for status" forever and only a human notices, hours later.
# grove-odoo-modules #141 sat unmergeable ~6.5h this way and was force-merged by
# hand — exactly the escape hatch branch-protection tightening is meant to stop.
#
# CRITICAL DESIGN: this detector is never triggered by the PR it is inspecting.
# A `pull_request`-triggered detector would have been dropped alongside the CI
# run it is meant to catch. It is a cheap, API-only sweep — it never checks out
# or runs PR code.
#
# CADENCE (GOL-3132): `schedule` alone is NOT a cadence. GitHub makes no
# delivery guarantee for cron and throttles it hard — measured 2026-10-06 over
# 7 days of history on `main`, this workflow's `3,23,43 * * * *` (72/day) was
# delivered ~5 times/day, and `prod-deploy-drift`'s `*/30` (48/day) and
# `preview-sweep`'s `0 */6` (4/day) ALSO landed at ~5/day. The uniform rate
# across three different crons is account-level throttling, not a config fault.
# A wedged PR therefore went undetected for hours, and the self-heal leg below
# left stale `ci-failure` issues open long after the PR recovered — each one
# mirrored to Paperclip, waking an agent for a condition that had already fixed
# itself (GOL-3126 / issue #994: minted 02:41Z, PR healed 06:07Z by a
# force-push, issue still open at 06:15Z).
#
# So `workflow_run` on `CI` is added as an event heartbeat, and `schedule` is
# kept as the floor. This does NOT weaken the invariant above, because the
# sweep is REPO-WIDE, not PR-scoped: every run iterates every open non-draft PR
# on the protected branch. The trigger and the subject are decoupled — a PR
# whose own CI trigger was dropped gets swept when some OTHER PR's (or main's)
# CI completes. `CI` fires on `pull_request`, `merge_group` and `push: main`
# (47 runs in the 24 h before this change), so the effective cadence becomes
# "minutes after any repo activity" instead of "whenever cron feels like it".
# Cost is nil: this repo is public, so Actions minutes on standard runners are
# free, and a sweep is ~25 s of API calls with no checkout.
#
# ⚠️ A `workflow_run` leg only exists once this file is on the DEFAULT branch,
# so it cannot be exercised from a PR — verify after merge with
# `gh run list --workflow missing-checks-sweep.yml --json event,createdAt`.
#
# Logic lives once in the shared action; this file only wires the schedule.
#   Shared action: Goldberry-Playground/grove-sites/.github/actions/ci-failure-router@main
# It reads the declared required contexts from .github/required-checks.json,
# reads check-runs AND commit statuses on each open non-draft PR's head SHA
# (grove-sites' `Lighthouse CI` is a commit status, not a check-run), and mints
# one deduped `ci-failure` issue — mirrored to Paperclip — per PR whose required
# context is absent past the grace window. The issue body carries the one-step
# close/reopen remediation. A control-plane drop (GOL-3031) is additionally
# self-healed by a bounded close/reopen — but only when the agent App identity
# below is provisioned; without it the sweep is alert-only.
name: Missing required-check sweep

on:
  schedule:
    # The declared floor, not the real cadence — see CADENCE above (GOL-3132).
    - cron: "3,23,43 * * * *" # every 20 min (offset to avoid the top-of-hour herd)
  workflow_run:
    # Event heartbeat. `CI` is the repo's highest-frequency workflow
    # (`pull_request` + `merge_group` + `push: main`); its conclusion is
    # irrelevant here, we only want the tick. Repo-wide sweep, so this is NOT
    # the inspected PR's own event — see CRITICAL DESIGN above.
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      grace-minutes:
        description: Minutes a head SHA must age before a missing check is flagged.
        required: false
        default: "20"

permissions:
  contents: read # read required-checks.json + head commit date
  pull-requests: read # list open PRs (the self-heal close+reopen runs under the App token below, not GITHUB_TOKEN)
  checks: read # check-runs on the head SHA
  statuses: read # commit statuses on the head SHA (e.g. Lighthouse CI)
  actions: read # workflow runs on the head SHA — tells an approval gate (`action_required`) apart from a dropped trigger (GOL-2732)
  issues: write # mint/close the deduped ci-failure issue

concurrency:
  group: missing-checks-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep open PRs for required checks that never started
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GOL-3031: identity for the self-heal close+reopen ONLY. GitHub creates
      # no workflow runs for events triggered by the ambient GITHUB_TOKEN, so a
      # reopen made with it re-fires nothing — while the close still disarms
      # auto-merge and spends the re-fire budget. An App-triggered reopen does
      # fire `pull_request: reopened`.
      #
      # Same App + switch as auto-approve.yml's enqueue identity (GOL-2524,
      # docs/runbooks/merge-queue-enqueue-identity.md): `vars.MERGE_QUEUE_APP_CLIENT_ID`
      # unset -> this step is skipped. `continue-on-error` covers a missing or
      # bad private key / an installation lacking the permission. Either way the
      # token output is empty, the router gets `self-heal: "false"`, and the
      # sweep stays alert-only (diagnosis + issue + manual remediation command).
      #
      # Scoped down to what close/reopen needs; issue minting, PR listing and
      # every read stay on GITHUB_TOKEN with the permissions above.
      - name: Mint self-heal identity (agent App)
        id: refire-identity
        if: vars.MERGE_QUEUE_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - uses: Goldberry-Playground/grove-sites/.github/actions/ci-failure-router@main
        with:
          mode: missing-checks
          github-token: ${{ github.token }}
          grace-minutes: ${{ github.event.inputs.grace-minutes || '20' }}
          self-heal: ${{ steps.refire-identity.outputs.token != '' && 'true' || 'false' }}
          refire-token: ${{ steps.refire-identity.outputs.token }}
