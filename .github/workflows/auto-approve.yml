# Agent-mergeable path for grove-sites (GOL-122, merge step fixed under GOL-276).
#
# Problem this solves:
#   Every Paperclip agent authors PRs under the SAME GitHub App bot
#   (agenticos-developer[bot]). `main` branch protection requires an
#   approving review, and GitHub blocks "approve your own pull request",
#   so no agent can satisfy the review gate on its own PRs.
#
# How it works:
#   - APPROVE as github-actions[bot] — a DISTINCT identity from the PR-author
#     App — which satisfies the required review. (This needs the org/repo
#     setting "Allow GitHub Actions to create and approve pull requests",
#     enabled org-wide under GOL-304.)
#   - MERGE as github-actions[bot] too, via a DIRECT squash (not `--auto`), so
#     it does NOT depend on the separate "Allow auto-merge" repo setting.
#     This requires `contents: write` (the previous version only had
#     `contents: read`, which is why the merge step failed with
#     "Resource not accessible by integration (mergePullRequest)").
#
# Guardrails (see GOL-122, hardened under GOL-1315):
#   - Never auto-approves human/external PRs (author must be the agent App bot)
#     -> human review is preserved for human PRs.
#   - Only fires AFTER the agent code review ("Claude Code Review") SUCCEEDED
#     -> not a blanket rubber-stamp.
#   - Head-SHA pinned (GOL-1315 #1): the review that triggered this run must
#     have run on the PR's CURRENT head. If a newer commit was pushed after the
#     gate passed, we abort — the new content passed no gate. Re-checked before
#     approve AND before every merge attempt, since the head can move mid-loop.
#   - Merges ONLY at OPEN:CLEAN (GOL-1315 #2): UNSTABLE means a check (incl. the
#     non-required review lane) is pending or FAILING; merging there would let a
#     failed/slow review be outrun. CLEAN requires every check green for the
#     current head.
#   - Never auto-merges PRs that touch `.github/workflows/**` (GOL-1315): changes
#     to the merge/CI machinery itself require a human review — the gate must not
#     rubber-stamp edits to the gate.
#   - Runs from the base-branch definition (workflow_run), so a PR cannot
#     modify this file to approve itself.
name: Auto-approve verified agent PRs

on:
  workflow_run:
    workflows: ["Claude Code Review"]
    types: [completed]

# contents:write lets github-actions[bot] perform the direct squash merge;
# pull-requests:write lets it post the approving review;
# actions:write lets it re-fire docker.yml via workflow_dispatch after the merge
# (the merge push itself is made with GITHUB_TOKEN, which GitHub suppresses from
# starting a `push` run — see the dispatch step below / GOL-768).
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-approve:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Approve + merge (github-actions[bot])
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          # The commit the "Claude Code Review" gate actually ran on. Everything
          # below must refuse to act if the PR head has moved off this SHA.
          GATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author -q '.author.login')
          # App bot logins appear as "app/agenticos-developer" via gh and
          # "agenticos-developer" via some APIs; accept both, reject all else.
          case "$AUTHOR" in
            app/agenticos-developer|agenticos-developer) ;;
            *)
              echo "PR #$PR author '$AUTHOR' is not the agent App bot; skipping (human/external PRs keep human review)."
              exit 0 ;;
          esac

          # GOL-1315: never auto-approve/merge a PR that edits the merge/CI
          # machinery. Those changes must get a human review — the gate must not
          # rubber-stamp edits to the gate.
          if gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path' \
               | grep -qE '^\.github/workflows/'; then
            echo "PR #$PR touches .github/workflows/**; requires human review — skipping auto-approve/merge."
            exit 0
          fi

          # GOL-1315 #1: the review that triggered this run must have run on the
          # PR's CURRENT head. If a newer commit landed after the gate passed,
          # that content passed no gate — abort rather than approve stale work.
          CUR_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q '.headRefOid')
          if [ "$CUR_SHA" != "$GATE_SHA" ]; then
            echo "Gate ran on $GATE_SHA but PR #$PR head is now $CUR_SHA; the current head passed no gate — skipping. The new head's own review run will re-trigger this."
            exit 0
          fi

          # Don't stack duplicate approvals on re-runs.
          ALREADY=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            -q '[.[] | select(.user.login=="github-actions[bot]" and .state=="APPROVED")] | length')
          if [ "${ALREADY:-0}" -gt 0 ]; then
            echo "PR #$PR already approved by github-actions[bot]."
          else
            gh pr review "$PR" --repo "$REPO" --approve --body \
              "Auto-approved by github-actions[bot]: the agent code review (Claude Code Review) passed on this PR's current head ($GATE_SHA). This identity is distinct from the PR-author App, so it satisfies branch protection's review requirement. Functional required status checks still gate the actual merge. (GOL-122 / GOL-276 / GOL-1315)"
          fi

          # Merge via a DIRECT squash (no `--auto`, so no dependency on the
          # "Allow auto-merge" setting). Wait briefly for the remaining required
          # checks to go green. GOL-1315 #2: merge ONLY at OPEN:CLEAN — UNSTABLE
          # would let a pending/failing (incl. non-required review) check be
          # outrun. Re-verify the head SHA every attempt: if the PR head moves
          # off the gated SHA mid-loop, abort — the new head passed no gate.
          for i in $(seq 1 30); do
            NOW_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q '.headRefOid')
            if [ "$NOW_SHA" != "$GATE_SHA" ]; then
              echo "PR #$PR head moved to $NOW_SHA (gate ran on $GATE_SHA); aborting merge — the new head passed no gate."
              exit 0
            fi
            MS=$(gh pr view "$PR" --repo "$REPO" --json state,mergeStateStatus -q '.state + ":" + .mergeStateStatus')
            echo "merge attempt $i — $MS"
            case "$MS" in
              MERGED:*)
                echo "PR #$PR already merged."; exit 0 ;;
              OPEN:CLEAN)
                if gh pr merge "$PR" --repo "$REPO" --squash --delete-branch; then
                  echo "Merged PR #$PR."

                  # The merge above was pushed to `main` with GITHUB_TOKEN, so
                  # GitHub will NOT start docker.yml's `push` run for it — the QA
                  # apps would keep serving the old image (GOL-768). Re-fire the
                  # build+publish leg explicitly via workflow_dispatch, which is
                  # the documented exception to the recursion guard. Only bother
                  # when the PR actually touched a path docker.yml builds from, so
                  # pure docs/backend merges don't trigger a redundant 4-image
                  # build (mirrors docker.yml's own path filter).
                  FILES=$(gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path')
                  if echo "$FILES" | grep -qE '^(apps/|packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.dockerignore|\.github/workflows/docker\.yml)'; then
                    if gh workflow run docker.yml --repo "$REPO" --ref main; then
                      echo "Dispatched docker.yml to build+deploy main HEAD."
                    else
                      echo "::warning::docker.yml dispatch failed; QA may serve the pre-merge image until the next deploy. Re-run docker.yml on main manually."
                    fi
                  else
                    echo "PR #$PR touched no docker.yml-watched paths; skipping deploy dispatch."
                  fi
                  exit 0
                fi ;;
            esac
            sleep 20
          done
          echo "Did not reach OPEN:CLEAN on the gated head within timeout; the approval stands and the PR will merge on a later trigger or a maintainer one-click."
