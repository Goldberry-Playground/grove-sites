# Agent-mergeable path for grove-sites (GOL-122).
#
# Problem this solves:
#   Every Paperclip agent authors PRs under the SAME GitHub App bot
#   (agenticos-developer[bot]). `main` branch protection requires an
#   approving review, and GitHub blocks "approve your own pull request",
#   so no agent can satisfy the review gate. Our PR token has no admin,
#   so `gh pr merge --admin` can't bypass it either. Today Josh admin-
#   merges every green PR by hand — an org-wide throughput blocker.
#
# How this fixes it WITHOUT new credentials, a second App, or admin:
#   This workflow submits the approving review as `github-actions[bot]`
#   — a DISTINCT identity from the PR-author App — so the self-approval
#   block does not apply. Crucially it only fires AFTER the agent code
#   review ("Claude Code Review" -> the `claude-review` check) has
#   SUCCEEDED, and only for PRs authored by our agent bot. The real
#   reviewer stays the claude-review agent; this job just translates a
#   passed agent review into the approval branch protection asks for.
#   All functional required status checks still gate the actual merge.
#
# Guardrails (see GOL-122):
#   - Never auto-approves human or external PRs (author must be the
#     agent App bot) -> human review is preserved for human PRs.
#   - Never approves unless the agent code review passed -> not a
#     blanket rubber-stamp.
#   - Runs from the base-branch definition (workflow_run), so a PR
#     cannot modify this file to approve itself.
name: Auto-approve verified agent PRs

on:
  workflow_run:
    workflows: ["Claude Code Review"]
    types: [completed]

# Least privilege: only what's needed to review + enable auto-merge.
permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    # Only when the agent code review passed, for a same-repo PR.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Approve (as github-actions[bot]) + enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author -q '.author.login')
          # App bot logins appear as "app/agenticos-developer" via gh and
          # "agenticos-developer" via some APIs; accept both, reject all else.
          case "$AUTHOR" in
            app/agenticos-developer|agenticos-developer) ;;
            *)
              echo "PR #$PR author '$AUTHOR' is not the agent App bot; skipping (human/external PRs keep human review)."
              exit 0 ;;
          esac

          # Don't stack duplicate approvals on re-runs.
          ALREADY=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            -q '[.[] | select(.user.login=="github-actions[bot]" and .state=="APPROVED")] | length')
          if [ "${ALREADY:-0}" -gt 0 ]; then
            echo "PR #$PR already approved by github-actions[bot]; ensuring auto-merge is on."
          else
            gh pr review "$PR" --repo "$REPO" --approve --body \
              "Auto-approved by github-actions[bot]: the agent code review (Claude Code Review) passed. This identity is distinct from the PR-author App, so it satisfies branch protection's review requirement. Functional required status checks still gate the actual merge. (GOL-122)"
          fi

          # Turn on auto-merge so GitHub merges once ALL required checks are green.
          # No-op-safe: needs the repo "Allow auto-merge" setting enabled.
          gh pr merge "$PR" --repo "$REPO" --auto --squash \
            || echo "Could not enable auto-merge (enable 'Allow auto-merge' in repo settings). Approval still stands; merge will be a one-click for a maintainer."
