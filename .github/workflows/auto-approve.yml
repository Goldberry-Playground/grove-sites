# Agent-mergeable path for grove-sites (GOL-122, merge step fixed under GOL-276).
#
# Problem this solves:
#   Every Paperclip agent authors PRs under the SAME GitHub App bot
#   (agenticos-developer[bot]). `main` branch protection requires an
#   approving review, and GitHub blocks "approve your own pull request",
#   so no agent can satisfy the review gate on its own PRs.
#
# How it works:
#   - APPROVE as github-actions[bot] — a DISTINCT identity from the PR-author
#     App — which satisfies the required review. (This needs the org/repo
#     setting "Allow GitHub Actions to create and approve pull requests",
#     enabled org-wide under GOL-304.)
#   - MERGE as github-actions[bot] too, via a squash `gh pr merge` (not `--auto`,
#     so no dependency on the separate "Allow auto-merge" repo setting). This
#     requires `contents: write` (an earlier version only had `contents: read`,
#     which is why the merge step failed with "Resource not accessible by
#     integration (mergePullRequest)").
#     `main` has an active merge-queue ruleset, so `gh pr merge --squash`
#     ENQUEUES rather than merges synchronously; the queue then runs the
#     required checks on a `gh-readonly-queue/` branch and performs the real
#     squash-merge into main as github-merge-queue[bot]. See the merge step for
#     why the post-merge deploy/CDN dispatch is NOT tied to that enqueue
#     (GOL-1658 / GOL-1661).
#
# Human-maintainer path (GOL-1854, port of odoocker GOL-1195):
#   A maintainer's OWN PRs hit the same wall from the other side: `main` requires
#   an approving review, GitHub blocks approving your own PR, and (until now) this
#   workflow skipped ALL human authors -> the maintainer's PR dead-ended with no
#   way to satisfy the gate. The old workaround was to RE-ORIGINATE the PR under
#   the agent App so it became bot-authored (GOL-1815 toil). We now clear the
#   review gate for a small allowlist of trusted human maintainers (MAINTAINERS)
#   by approving as github-actions[bot] (a DISTINCT identity, so no self-approval),
#   but we deliberately DO NOT enqueue/merge for them -> the human keeps full
#   control over WHEN their PR merges. CI + protected-paths + required checks
#   still gate. Maintainer PRs are exempt from the agent-review sign-off gate
#   (a human reviews them by hand).
#
# Guardrails (see GOL-122 / GOL-1854):
#   - Auto-approves only (a) the agent App bot's PRs and (b) an explicit
#     human-maintainer allowlist (MAINTAINERS). All other human/external PRs
#     still keep the normal human-review requirement.
#   - AGENT PRs only proceed once the agent review has SIGNED OFF: the unified
#     `agent-review/*` check-run on the head SHA must be `success` (GOL-1734 /
#     GOL-1738). The old standalone "Claude Code Review" workflow was removed;
#     the reviewer signal is now the SHA-bound check-run emitted by the
#     github-sync plugin, so this fires on CI completion and then gates on that
#     check. -> not a blanket rubber-stamp.
#   - Agent PRs get approve + enqueue/merge; maintainer PRs get approve ONLY
#     (no auto-merge) so the human decides when to merge.
#   - Runs from the base-branch definition (workflow_run), so a PR cannot
#     modify this file to approve itself.
# Merge-queue enqueue identity (GOL-2524) -- why this workflow does NOT enqueue
# with the default token:
#   GitHub never creates workflow runs for events triggered by `GITHUB_TOKEN`
#   (the documented anti-recursion rule -- the same rule that wedged the daily
#   rate-check PR in GOL-2114). A merge queue turns `gh pr merge --squash
#   [--auto]` on an already-green PR into an ENQUEUE, and an enqueue performed
#   by `GITHUB_TOKEN` produces a merge group that NO `merge_group` workflow ever
#   reacts to: zero runs, zero check-runs. The entry sits at `AWAITING_CHECKS`
#   until GitHub's 30-minute `checkResponseTimeout` expires and silently ejects
#   the PR -- unmerged, with no red check and no notification.
#
#   The cruel part is that a PR only reaches the enqueue because the full-CI
#   gate below already passed: the healthier the PR, the more likely it silently
#   fails to merge. Proven by two same-day A/Bs on 2026-09-23 (odoocker #729,
#   grove-odoo-modules #277): enqueued by `github-actions` -> 0 merge_group runs
#   in 4-6 min; dequeued and re-enqueued as the agent App -> 5-6 runs within 30s
#   and a clean merge, same commits, same required checks.
#
#   Fix: mint an App installation token for the enqueue (its events DO create
#   workflow runs) and use it for that ONE call. Approval, thread resolution and
#   every read stay on `GITHUB_TOKEN` -- least privilege, and the approving
#   identity is deliberately unchanged. When the App secrets are not provisioned
#   the enqueue degrades to `GITHUB_TOKEN` (same graceful shape as
#   `RATE_CHECK_PR_TOKEN` in GOL-2114) and the wedge detector below turns the
#   remaining failure from silent into loud.
name: Auto-approve verified agent PRs

on:
  # GOL-1938: three entrypoints, ALL evaluated from the BASE-branch workflow
  # definition. workflow_run / check_run / pull_request_review each run the
  # default-branch copy of this file, never a PR-supplied one, so the "a PR
  # cannot edit this workflow to approve itself" property is preserved.
  #   - workflow_run:         CI finished (the original trigger).
  #   - check_run:            an agent-review/* check flipped to success AFTER CI
  #                           had already finished — the case that used to stall
  #                           forever because nothing re-fired the workflow.
  #   - pull_request_review:  a human maintainer submitted an approving review —
  #                           enqueues without waiting for a fresh push.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  check_run:
    types: [completed]
  pull_request_review:
    types: [submitted]

# contents:write lets github-actions[bot] enqueue/squash-merge the PR;
# pull-requests:write lets it post the approving review;
# actions:write lets it re-fire docker.yml/cdn-asset-sync.yml via
# workflow_dispatch — but ONLY on the fallback direct-merge path (queue
# disabled), where the merge push is made with GITHUB_TOKEN and GitHub
# suppresses its `push` run (GOL-768). On the normal merge-queue path the real
# merge push by github-merge-queue[bot] fires those `push` workflows itself, so
# no dispatch is needed (GOL-1661) — see the merge step.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-approve:
    # GOL-1938: gate hard at the job level so (a) high-volume check_run events
    # that are NOT an agent-review/* success never start a runner [acceptance
    # #3], and (b) the bot's OWN approving review never re-triggers this
    # workflow [acceptance #4].
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.conclusion == 'success' &&
       startsWith(github.event.check_run.name, 'agent-review/')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.review.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      # GOL-1406-A: base-branch checkout so the Tier-0 carve-out below runs the
      # base definition of scripts/ci/protected-paths-carveout.mjs, not a
      # PR-supplied one (a PR cannot edit the carve-out to approve itself).
      - name: Check out base-branch scripts (protected-paths carve-out)
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # GOL-1938: the target PR is carried differently by each trigger. Resolve
      # it once here and hand it to the shared gate body below via $GITHUB_ENV,
      # so the entrypoints share the gate instead of copy-pasting it.
      - name: Resolve target PR number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          CR_PR: ${{ github.event.check_run.pull_requests[0].number }}
          CR_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          set -euo pipefail
          PR=""
          case "$EVENT_NAME" in
            workflow_run)        PR="$WR_PR" ;;
            pull_request_review) PR="$REVIEW_PR" ;;
            check_run)
              # check_run carries PR context in .pull_requests[], but that array
              # can be EMPTY (App-created check-runs, or a fork PR). Fall back to
              # a head-SHA -> open-PR lookup so those still resolve. (GOL-1938)
              PR="$CR_PR"
              if [ -z "$PR" ] || [ "$PR" = "null" ]; then
                PR=$(gh api "repos/$REPO/commits/$CR_SHA/pulls" \
                  --jq '[.[] | select(.state=="open")][0].number' 2>/dev/null || true)
              fi
              ;;
          esac
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open target PR resolved for event '$EVENT_NAME'; nothing to do."
            PR=""
          else
            echo "Resolved target PR #$PR (event: $EVENT_NAME)."
          fi
          echo "PR=${PR}" >> "$GITHUB_ENV"

      # GOL-2524: identity used for the merge-queue ENQUEUE only (see the header
      # note). `vars.MERGE_QUEUE_APP_CLIENT_ID` is the switch: unset -> this step
      # is skipped, `steps.enqueue-identity.outputs.token` is empty, and the
      # enqueue falls back to GITHUB_TOKEN exactly as before (graceful
      # degradation, same shape as RATE_CHECK_PR_TOKEN in GOL-2114). The App
      # client id is not a secret (a repo/org *variable*), which is also what
      # keeps this `if:` a plain expression.
      #
      # The minted token is scoped down to the two permissions the enqueue
      # actually needs; the App's other installation permissions are NOT carried
      # into this workflow. Provisioning: docs/runbooks/merge-queue-enqueue-identity.md.
      - name: Mint merge-queue enqueue identity (agent App)
        id: enqueue-identity
        if: vars.MERGE_QUEUE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Approve + merge (github-actions[bot])
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Empty unless the App identity above was minted. Consumed ONLY by the
          # enqueue call; every other `gh` call keeps the default token. (GOL-2524)
          ENQUEUE_TOKEN: ${{ steps.enqueue-identity.outputs.token }}
        run: |
          set -euo pipefail

          # PR is resolved by the previous step. Empty when the event
          # carried no actionable PR (e.g. a check_run whose head SHA
          # has no open PR); nothing to do in that case. (GOL-1938)
          if [ -z "${PR:-}" ]; then
            echo "No target PR to process; exiting."
            exit 0
          fi

          # Trusted human maintainers whose OWN PRs may auto-clear the review
          # gate (space-separated logins). GitHub blocks approving your own PR,
          # so without this a maintainer's PR dead-ends with no way to satisfy
          # the required review — previously worked around by re-originating the
          # PR under the agent App (GOL-1815 toil). Keep this list minimal and in
          # sync with .github/CODEOWNERS. (GOL-1854)
          MAINTAINERS="EngineeringMoonBear"

          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author -q '.author.login')
          # App bot logins appear as "app/agenticos-developer" via gh and
          # "agenticos-developer" via some APIs; accept both.
          KIND=""
          case "$AUTHOR" in
            app/agenticos-developer|agenticos-developer) KIND="agent" ;;
          esac
          if [ -z "$KIND" ]; then
            for m in $MAINTAINERS; do
              # Match a bare login ONLY. We intentionally reject the "app/$m"
              # form: real human maintainers always appear as bare logins, never
              # "app/<login>". A GitHub App whose slug happens to equal a
              # maintainer login must NOT be trusted as a human maintainer — the
              # agent App is matched separately above. (GOL-1372 / GOL-1322)
              if [ "$AUTHOR" = "$m" ]; then KIND="maintainer"; break; fi
            done
          fi
          if [ -z "$KIND" ]; then
            echo "PR #$PR author '$AUTHOR' is not the agent App bot or a listed maintainer; skipping (human/external PRs keep human review)."
            exit 0
          fi
          echo "PR #$PR author '$AUTHOR' classified as: $KIND"

          # NOTE (merge GOL-1734 + GOL-1406-A): both gates are required and are
          # ordered cheap-first. The protected-paths carve-out is a single API call
          # and exits immediately, so a protected-path PR never burns the ~15-minute
          # agent-review poll below.
          # ── Tier-0 protected-paths carve-out (GOL-1406-A) ──
          # Defense-in-depth before the protected-paths-guard becomes a REQUIRED
          # check: never auto-approve/merge an agent PR that touches a protected
          # path. Same PROTECTED_GLOBS as protected-paths-guard.yml (both
          # generated from AgenticOS scripts/ci/gen-protected-paths-guard.py, so
          # they cannot drift). Fail-closed: if the check cannot run, withhold.
          PR_FILES=$(gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path')
          if REASON=$(PR_FILES="$PR_FILES" node scripts/ci/protected-paths-carveout.mjs); then
            :  # no protected path touched — proceed to approve
          else
            echo "PR #$PR not auto-approved: $REASON"
            exit 0
          fi

          # ── Unified agent-review gate (GOL-1734 / GOL-1738, Ada sign-off) ──
          # AGENT PRs only. Maintainer PRs are exempt — a human reviews them by
          # hand; the review-count gate is cleared by the github-actions[bot]
          # approval below. (GOL-1854)
          if [ "$KIND" = "agent" ]; then
          # The github-sync plugin emits exactly one `agent-review/<reviewer>`
          # check-run per non-draft agent PR: seeded `in_progress` on open,
          # flipped to `success` ON THAT HEAD SHA only when the reviewer signs
          # the review issue `done`. It is COMMENT-only — the machine signal is a
          # check-run, never a GitHub APPROVE event. We require it PRESENT and
          # `success` on the CURRENT head SHA before approving/merging:
          #   absent / in_progress / neutral / failure / success-on-old-SHA => BLOCK.
          # We poll so a sign-off landing shortly after CI is still caught; a
          # much-later sign-off re-fires this workflow on the next CI run.
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q '.headRefOid')
          REVIEW_STATE=absent
          for i in $(seq 1 30); do   # up to ~15 min (30 × 30s)
            REVIEW_STATE=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              -q '[.check_runs[] | select(.name | startswith("agent-review/"))]
                   | if length==0 then "absent"
                     elif any(.[]; .status=="completed" and .conclusion=="success") then "success"
                     elif all(.[]; .status=="completed") then "completed-not-success"
                     else "pending" end')
            case "$REVIEW_STATE" in
              success|completed-not-success) break ;;
            esac
            echo "agent-review/* on $HEAD_SHA: $REVIEW_STATE (poll $i/30)…"
            sleep 30
          done
          if [ "$REVIEW_STATE" != "success" ]; then
            echo "PR #$PR agent-review/* gate not satisfied on $HEAD_SHA (state: $REVIEW_STATE); not approving. The reviewer must sign off (COMMENT-only gate — GOL-1734)."
            exit 0
          fi
          echo "agent-review/* is success on $HEAD_SHA; proceeding to approve + merge."
          fi

          # Don't stack duplicate approvals on re-runs.
          ALREADY=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            -q '[.[] | select(.user.login=="github-actions[bot]" and .state=="APPROVED")] | length')
          if [ "${ALREADY:-0}" -gt 0 ]; then
            echo "PR #$PR already approved by github-actions[bot]."
          else
            gh pr review "$PR" --repo "$REPO" --approve --body \
              "Auto-approved by github-actions[bot]: required CI checks passed (for agent PRs, the agent-review/* sign-off is also success on the head SHA). This identity is distinct from the PR author, so it satisfies branch protection's review requirement without self-approval. Functional required status checks (and protected-paths for protected files) still gate the actual merge. (GOL-122 / GOL-276 / GOL-1734 / GOL-1854)"
          fi

          # Maintainer PRs: approve ONLY. The human decides WHEN to merge, so we
          # do not enqueue/merge on their behalf. CI + protected-paths + required
          # checks still gate the actual merge. (GOL-1854)
          if [ "$KIND" = "maintainer" ]; then
            echo "PR #$PR is a maintainer PR: review gate cleared; leaving the merge decision to the author."
            exit 0
          fi

          # Re-fire the deploy (docker.yml) + CDN (cdn-asset-sync.yml) builds for
          # the just-merged main HEAD. ONLY call this after observing an ACTUAL
          # synchronous merge (state == MERGED), i.e. the fallback path where the
          # merge queue is disabled and `gh pr merge --squash` merged directly
          # with GITHUB_TOKEN. GitHub suppresses the `push` run for GITHUB_TOKEN
          # merges (GOL-768), so those two `on: push:[main]` workflows would not
          # fire on their own — hence the explicit workflow_dispatch, the
          # documented exception to the recursion guard. On the merge-queue path
          # we do NOT call this: the queue's real merge push (by
          # github-merge-queue[bot], not GITHUB_TOKEN) fires both `push`
          # workflows itself, and dispatching on *enqueue* would build a
          # pre-merge `main` (GOL-1661). Path filters mirror each workflow's own.
          dispatch_post_merge_builds() {
            local files
            files=$(gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path')
            if echo "$files" | grep -qE '^(apps/|packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.dockerignore|\.github/workflows/docker\.yml)'; then
              if gh workflow run docker.yml --repo "$REPO" --ref main; then
                echo "Dispatched docker.yml to build+deploy main HEAD."
              else
                echo "::warning::docker.yml dispatch failed; QA may serve the pre-merge image until the next deploy. Re-run docker.yml on main manually."
              fi
            else
              echo "PR #$PR touched no docker.yml-watched paths; skipping deploy dispatch."
            fi
            if echo "$files" | grep -qE '^apps/[^/]+/public/photos/'; then
              if gh workflow run cdn-asset-sync.yml --repo "$REPO" --ref main; then
                echo "Dispatched cdn-asset-sync.yml to mirror changed photos to the CDN."
              else
                echo "::warning::cdn-asset-sync.yml dispatch failed; the CDN may serve stale photos until the next sync. Re-run cdn-asset-sync.yml on main manually."
              fi
            fi
          }

          # GraphQL wants owner/name split; the dispatch check below uses them.
          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          # ── GOL-2524: merge-queue dispatch check ─────────────────────────
          # Everything here answers one question: did the merge group this PR
          # was just put into actually get any workflow runs? A group with zero
          # runs has no required check to wait for, so it will sit at
          # AWAITING_CHECKS until GitHub's ~30-minute checkResponseTimeout
          # ejects the PR -- unmerged, with no red check and no notification.
          WEDGE_GRACE_SECONDS=180

          # state \t enqueuedAt \t enqueuer \t mergeGroupCommit, or empty when
          # the PR is not queued. Non-zero exit means "could not read".
          queue_entry_tsv() {
            # shellcheck disable=SC2016  # $owner/$name/$pr are GraphQL variables
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$pr:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){
                    mergeQueueEntry{
                      state enqueuedAt enqueuer{login} headCommit{oid}
                    }
                  }
                }
              }' \
              -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
              --jq '.data.repository.pullRequest.mergeQueueEntry
                    | if . == null then ""
                      else [.state, .enqueuedAt, (.enqueuer.login // "?"),
                            (.headCommit.oid // "")] | @tsv end' 2>/dev/null
          }

          # Count of workflow runs on a commit; empty when unreadable.
          commit_run_count() {
            gh api "repos/$REPO/actions/runs?head_sha=$1&per_page=1" -q '.total_count' 2>/dev/null || echo ""
          }

          # Prints a diagnosis and returns 0 ONLY on the dead-group signature:
          # AWAITING_CHECKS, past the grace window, merge-group commit with zero
          # workflow runs. Every other shape -- not queued, another state, still
          # inside the window, any unreadable API -- returns 1 and says nothing.
          # That bias is deliberate: firing FAILS the run, so a false positive
          # would block a healthy PR's merge.
          detect_queue_wedge() {
            local entry state enq_at enqueuer group_sha enq_epoch age runs

            entry=$(queue_entry_tsv) || return 1
            [ -n "$entry" ] || return 1
            state=$(printf '%s' "$entry" | cut -f1)
            enq_at=$(printf '%s' "$entry" | cut -f2)
            enqueuer=$(printf '%s' "$entry" | cut -f3)
            group_sha=$(printf '%s' "$entry" | cut -f4)

            # Only AWAITING_CHECKS can be wedged: QUEUED means the group has not
            # formed yet, MERGEABLE means the checks already reported.
            [ "$state" = "AWAITING_CHECKS" ] || return 1
            [ -n "$group_sha" ] || return 1
            # A group commit that IS the PR head means no merge commit was built;
            # its runs would be the PR's own CI, not merge_group runs.
            [ "$group_sha" != "$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q '.headRefOid')" ] || return 1

            enq_epoch=$(date -u -d "$enq_at" +%s 2>/dev/null || echo "")
            [ -n "$enq_epoch" ] || return 1
            age=$(( $(date -u +%s) - enq_epoch ))
            [ "$age" -ge "$WEDGE_GRACE_SECONDS" ] || return 1

            runs=$(commit_run_count "$group_sha")
            [ -n "$runs" ] || return 1
            [ "$runs" -eq 0 ] || return 1

            cat <<WEDGE
          ::error title=Merge group wedged (GOL-2524)::PR #$PR is enqueued but its merge group has no workflow runs; it will be ejected unmerged.

          PR #$PR merge-queue entry has been AWAITING_CHECKS for ${age}s and its merge-group
          commit $group_sha has ZERO workflow runs. The required checks were never
          dispatched, so the entry will sit until GitHub's ~30-minute checkResponseTimeout
          ejects the PR -- unmerged, with no red check and no notification.

            enqueued by : $enqueuer
            group commit: $group_sha
            queue       : https://github.com/$REPO/queue/main

          Cause (GOL-2524): events triggered by GITHUB_TOKEN never create workflow runs.
          If 'enqueued by' above is github-actions, this run enqueued with the default
          token because the App identity is not provisioned in this repo. Provision the
          repo/org variable MERGE_QUEUE_APP_CLIENT_ID and the secret
          MERGE_QUEUE_APP_PRIVATE_KEY (agent App) -- runbook:
          docs/runbooks/merge-queue-enqueue-identity.md

          Rescue now -- re-enqueue under a NON-GITHUB_TOKEN identity (bypasses no gate; it
          makes the required checks actually run). PR node id:
            gh pr view $PR --repo $REPO --json id -q .id
          then, with an App/PAT token:
            gh api graphql -f query='mutation{dequeuePullRequest(input:{id:"<NODE_ID>"}){mergeQueueEntry{state}}}'
            gh api graphql -f query='mutation{enqueuePullRequest(input:{pullRequestId:"<NODE_ID>"}){mergeQueueEntry{position state enqueuer{login}}}}'
          Confirm enqueuer.login is NOT github-actions, then check that
            gh api "repos/$REPO/actions/runs?head_sha=<NEW_GROUP_SHA>" -q .total_count
          is non-zero within ~60s.
          WEDGE
            return 0
          }

          # The healthy counterpart: 0 when the merge group has at least one
          # workflow run. Used only to stop watching early, never to raise an
          # alarm, so "not queued" and "cannot tell" both return 1 (keep looking).
          queue_group_dispatched() {
            local entry group_sha runs
            entry=$(queue_entry_tsv) || return 1
            [ -n "$entry" ] || return 1
            group_sha=$(printf '%s' "$entry" | cut -f4)
            [ -n "$group_sha" ] || return 1
            runs=$(commit_run_count "$group_sha")
            [ -n "$runs" ] || return 1
            [ "$runs" -gt 0 ]
          }
          # ── end GOL-2524 merge-queue dispatch check ──────────────────────

          # GOL-2524: after an enqueue this job would otherwise exit green
          # immediately — the exact moment a dead merge group starts its silent
          # 30-minute countdown. Watch just long enough to tell a dispatched
          # group from a dead one, and stop as soon as the answer is known.
          watch_queue_dispatch() {
            local i
            for i in $(seq 1 12); do   # up to ~4 min (12 × 20s)
              if [ "$(gh pr view "$PR" --repo "$REPO" --json state -q '.state')" = "MERGED" ]; then
                echo "PR #$PR merged."
                return 0
              fi
              if WEDGE=$(detect_queue_wedge); then
                printf '%s\n' "$WEDGE"
                return 1
              fi
              if queue_group_dispatched; then
                echo "Merge group for PR #$PR has workflow runs; the queue owns it from here."
                return 0
              fi
              sleep 20
            done
            echo "PR #$PR: no dead-group signature within the watch window; leaving it to the merge queue."
            return 0
          }

          # Enqueue via squash `gh pr merge` (no `--auto`, so no dependency on the
          # "Allow auto-merge" setting). With the active merge-queue ruleset this
          # ENQUEUES; the queue merges later. Wait briefly for the PR to become
          # enqueueable after our approval registers, then hand it to the queue.
          #
          # NEVER pass --delete-branch: deleting the head ref cancels the queued
          # merge and closes the PR unmerged (GOL-1658 — this silently dropped
          # grove-odoo-modules#93). delete_branch_on_merge=true removes the head
          # ref automatically after the queue merges.
          for i in $(seq 1 30); do
            MS=$(gh pr view "$PR" --repo "$REPO" --json state,mergeStateStatus -q '.state + ":" + .mergeStateStatus')
            echo "merge attempt $i — $MS"
            case "$MS" in
              MERGED:*)
                # Already merged before we could enqueue — direct/fallback merge.
                # Fire the deploy/CDN builds the suppressed push would have.
                echo "PR #$PR already merged; firing post-merge builds."
                dispatch_post_merge_builds
                exit 0 ;;
              OPEN:CLEAN|OPEN:UNSTABLE)
                # GOL-2524: with the queue active this call ENQUEUES, so it runs
                # under the App identity when one was minted. Empty ENQUEUE_TOKEN
                # -> GH_TOKEN keeps its step-level value (the default token).
                if OUT=$(GH_TOKEN="${ENQUEUE_TOKEN:-$GH_TOKEN}" gh pr merge "$PR" --repo "$REPO" --squash 2>&1); then
                  echo "$OUT"
                  # Distinguish an actual direct merge (queue disabled) from an
                  # enqueue (queue active) by re-reading the PR state.
                  NEW=$(gh pr view "$PR" --repo "$REPO" --json state -q '.state')
                  if [ "$NEW" = "MERGED" ]; then
                    # GOL-768's explicit dispatch exists ONLY because a
                    # GITHUB_TOKEN merge push is suppressed. An App-identity merge
                    # push is NOT suppressed — it fires both `on: push:[main]`
                    # workflows itself, so dispatching too would build main twice
                    # (GOL-2524).
                    if [ -n "${ENQUEUE_TOKEN:-}" ]; then
                      echo "Merged PR #$PR directly as the App identity; its push fires docker.yml + cdn-asset-sync.yml on its own — not dispatching (GOL-2524)."
                    else
                      echo "Merged PR #$PR directly (no merge queue); firing post-merge builds (GOL-768)."
                      dispatch_post_merge_builds
                    fi
                  else
                    echo "Enqueued PR #$PR into the merge queue. The queue's real merge push (github-merge-queue[bot]) fires docker.yml + cdn-asset-sync.yml via on:push:[main] — no dispatch here (GOL-1661)."
                    watch_queue_dispatch || exit 1
                  fi
                  exit 0
                fi
                echo "$OUT"
                # An 'already queued' error means a prior trigger enqueued it;
                # that's success, not a failure — the queue owns it now.
                case "$OUT" in
                  *[Qq]ueue*) echo "PR #$PR already in the merge queue; nothing to do."; exit 0 ;;
                esac ;;
            esac
            sleep 20
          done
          echo "PR #$PR not merged/enqueued within timeout; the approval stands and it will enqueue on a later trigger or a maintainer one-click."
