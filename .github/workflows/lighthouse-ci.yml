name: Lighthouse CI

# GOL-866 — Core Web Vitals lab gate for the Grove performance budget
# (GOL-864 §1a/§1b): LCP <= 2.0s, CLS <= 0.05, TBT <= 200ms (INP lab proxy),
# total byte weight <= 540 KB. Assertions live in lighthouserc.json.
#
# This half of the budget needs a RUNNING page, so it targets a per-PR preview
# URL. Preview droplets only exist for PRs labeled `qa` (see preview-up.yml /
# README-preview.md), so it cannot run on every PR the way perf-budget.yml does.
#
# ── CI wiring (GOL-871) ──────────────────────────────────────────────────────
# Iris owns the config + audit runner; Ada owns this wiring. Three triggers:
#
#   1. workflow_dispatch — manual audit of an explicit preview URL (unchanged).
#   2. workflow_run("preview-up") — auto-audit once a preview is up. The audit
#      recovers the preview URLs from preview-up's PR comment (the
#      `<!-- grove-preview-bot -->` table is the source of truth for the URLs
#      terraform actually produced) and posts the "Lighthouse CI" commit status
#      on the PR head SHA.
#   3. pull_request (gate shim) — the ruleset can't condition a required check
#      on a label, so "Lighthouse CI" is required for ALL PRs; this shim keeps
#      the requirement honest without blocking PRs that have no preview:
#        - non-`qa` PR -> post "Lighthouse CI" = success (nothing to audit).
#        - `qa` PR      -> post "Lighthouse CI" = pending; the audit job (fired
#                          by preview-up via workflow_run) resolves it to the
#                          real pass/fail. Merge stays blocked until it does.
#      Net effect: the gate only ever *blocks* on `qa`-labeled PRs, exactly as
#      GOL-866 asks, while non-`qa` PRs sail through green.
#      GOL-1316 hardening: the shim never overwrites a real audit result (a
#      status carrying an Actions-run target_url), so toggling the `qa` label on
#      an already-audited SHA can no longer flip a failure back to success; and
#      the merge_group queue-gate verifies each queued PR's real conclusion
#      instead of posting an unconditional success.

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Preview URL to audit (e.g. https://nursery.pr-123.preview.gatheringatthegrove.com)"
        required: true
        type: string
  workflow_run:
    workflows: ["preview-up"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    branches: [main]

permissions:
  contents: read
  statuses: write       # post the "Lighthouse CI" commit status (the required context)
  pull-requests: read   # read the preview-up comment to recover URLs

concurrency:
  # Scope by event so the pull_request gate and the workflow_run audit never
  # cancel each other (same head SHA otherwise collides); within one event type
  # a newer run for the same SHA supersedes the older.
  group: lighthouse-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Merge-queue gate — queue branches fire `merge_group`, where no PR (and no
  # preview) exists. The real audit already ran on the PR before it queued, so
  # post success on the queue SHA to satisfy the required "Lighthouse CI"
  # context; without this every queue entry times out.
  #
  # GOL-1316: this must *verify* the queued PR's real "Lighthouse CI" conclusion
  # before passing the queue SHA — an unconditional success let a PR whose audit
  # failed sail through the queue. We recover the PR number(s) from the
  # merge-queue ref (`.../pr-<n>-<sha>`, multiple for a batched group), read each
  # PR's latest "Lighthouse CI" status, and only pass the group when every queued
  # PR is green. Anything else (a failure, a missing status, or an unparseable
  # ref) blocks the group — fail closed, never rubber-stamp.
  queue-gate:
    name: Lighthouse queue gate
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const mg = context.payload.merge_group;
            const groupSha = mg.head_sha;

            const post = (state, description) =>
              github.rest.repos.createCommitStatus({
                owner, repo, sha: groupSha, context: 'Lighthouse CI', state, description,
              });

            // Recover the queued PR number(s) from the merge-queue ref, e.g.
            // refs/heads/gh-readonly-queue/main/pr-123-<sha> (a batched group can
            // carry several `pr-<n>` segments).
            const ref = mg.head_ref || '';
            const prNumbers = [...ref.matchAll(/pr-(\d+)/g)].map(m => Number(m[1]));
            if (prNumbers.length === 0) {
              core.setFailed(`Could not parse a PR number from merge_group ref: "${ref}"`);
              await post('failure', 'Queue gate could not identify the PR to verify — blocking');
              return;
            }

            const results = [];
            for (const number of prNumbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              // getCombinedStatusForRef returns the latest status per context —
              // the same value the required-check gate itself reads.
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: pr.head.sha,
              });
              const lh = combined.statuses.find(s => s.context === 'Lighthouse CI');
              const state = lh ? lh.state : 'missing';
              results.push(`PR #${number}: ${state}`);
              if (state !== 'success') {
                core.setFailed(`PR #${number} Lighthouse CI is "${state}", not success — blocking the queue.`);
                await post('failure', `PR #${number} Lighthouse audit did not pass (${state}) — blocking`);
                return;
              }
            }

            await post('success', `Merge queue verified: ${results.join(', ')}`);
  # ───────────────────────────────────────────────────────────────────────────
  # Gate shim — sets the "Lighthouse CI" required status for a PR based on its
  # label. Runs on every PR (cheap, no build).
  #
  # GOL-1316: the shim must NEVER overwrite a real audit result. The audit /
  # preview-failed jobs post "Lighthouse CI" with a target_url pointing at the
  # Actions run; the shim never sets target_url. Because commit statuses are
  # latest-wins, a shim firing on `unlabeled` used to flip a genuine *failure*
  # back to success on the same head SHA (remove the `qa` label -> non-qa ->
  # success), bypassing the gate. So: if a real audit result already exists for
  # this SHA, the audit is authoritative — leave it untouched.
  gate:
    name: Lighthouse gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;

            // Don't clobber a real audit result. getCombinedStatusForRef returns
            // the latest status per context; the audit/preview-failed jobs are the
            // only ones that set target_url (an Actions run URL).
            const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
              owner, repo, ref: sha,
            });
            const latest = combined.statuses.find(s => s.context === 'Lighthouse CI');
            if (latest && latest.target_url && latest.target_url.includes('/actions/runs/')) {
              core.info(`Real Lighthouse audit result already present for ${sha} (state=${latest.state}) — leaving it untouched.`);
              return;
            }

            const isQa = pr.labels.some(l => l.name === 'qa');
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              context: 'Lighthouse CI',
              state: isQa ? 'pending' : 'success',
              description: isQa
                ? 'Preview coming up — Lighthouse audit will run once it is live'
                : 'No preview (non-qa PR) — nothing to audit',
            });

  # ───────────────────────────────────────────────────────────────────────────
  # preview-up failed → the qa PR has no live preview to audit. Flip the pending
  # status to failure so the PR is clearly red instead of stuck pending forever.
  #
  # Match only genuine failure conclusions — NOT `!= 'success'`. `workflow_run`
  # also fires when preview-up concludes `skipped` (every non-`qa` PR label-gates
  # its jobs off), and `'skipped' != 'success'` would post "Lighthouse CI" =
  # failure over the gate shim's green, reddening / blocking every non-qa PR.
  preview-failed:
    name: Preview failed
    if: github.event_name == 'workflow_run' && contains(fromJSON('["failure", "cancelled", "timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run.head_sha) return;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              context: 'Lighthouse CI',
              state: 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`,
              description: `Preview environment failed to come up (${run.conclusion}) — cannot audit`,
            });

  # ───────────────────────────────────────────────────────────────────────────
  # Audit — the real Lighthouse run against the preview.
  audit:
    name: Lighthouse audit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Recover the PR head SHA and the preview URL(s) to audit.
      #   - workflow_dispatch: the URL is the explicit input.
      #   - workflow_run: read preview-up's "grove-preview-bot" PR comment and
      #     parse the per-tenant URL table (the URLs terraform actually output).
      - id: ctx
        uses: actions/github-script@v9
        with:
          script: |
            let headSha = '';
            let prNumber = null;
            let urls = '';

            if (context.eventName === 'workflow_dispatch') {
              headSha = context.sha;
              urls = context.payload.inputs.preview_url || '';
            } else {
              const run = context.payload.workflow_run;
              headSha = run.head_sha;
              prNumber = run.pull_requests?.[0]?.number ?? null;
              if (!prNumber) {
                // pull_requests is empty for some events — recover via head SHA.
                const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: headSha,
                });
                prNumber = data.find(p => p.state === 'open')?.number ?? data[0]?.number ?? null;
              }
              if (prNumber) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                });
                const c = comments.find(x => x.body && x.body.includes('<!-- grove-preview-bot -->'));
                if (c) {
                  // Rows look like: | **nursery** | https://nursery.pr-123.preview... |
                  urls = [...c.body.matchAll(/\|\s*\*\*[^*|]+\*\*\s*\|\s*(https?:\/\/[^\s|]+)\s*\|/g)]
                    .map(m => m[1])
                    .join('\n');
                }
              }
            }

            core.setOutput('headSha', headSha);
            core.setOutput('urls', urls);
            if (!urls) {
              core.warning('No preview URL recovered — see the guard step.');
            } else {
              core.info(`Auditing:\n${urls}`);
            }

      - name: Guard — a preview URL is required
        if: steps.ctx.outputs.urls == ''
        run: |
          echo "::error::No preview URL recovered (no grove-preview-bot comment, or its URL table was empty)."
          exit 1

      - name: Run Lighthouse CI against the preview
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: ${{ steps.ctx.outputs.urls }}
          configPath: ./lighthouserc.json
          # Assertions in lighthouserc.json fail the job on a budget breach.
          uploadArtifacts: true
          temporaryPublicStorage: true

      # Post the "Lighthouse CI" status on the PR head SHA (workflow_run path only;
      # workflow_dispatch has no PR to gate). Runs on both pass and fail.
      - name: Report Lighthouse status on the PR
        if: always() && github.event_name == 'workflow_run' && steps.ctx.outputs.headSha != ''
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.ctx.outputs.headSha }}',
              context: 'Lighthouse CI',
              state: ok ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: ok
                ? 'Core Web Vitals + byte weight within the GOL-864 §1 budget'
                : 'Budget breach or audit error — see the run for the failing assertion',
            });
