name: DO App Spec — validate

# Lint every infra/do/*.yaml spec on PRs and pushes that touch them.
# Catches malformed App Platform specs before they reach DigitalOcean.
#
# Tokenless: `doctl apps spec validate --schema-only` parses the spec
# locally and needs no DigitalOcean credentials, so this workflow holds no
# secrets. The API-side correctness check (region, instance size, ...) is
# left to App Platform at deploy time.
#
# Security note: this workflow uses only repo-controlled file paths. It
# does NOT consume any untrusted event payload fields (PR title/body/branch
# name) in run: blocks.

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/do/**"
      - ".github/workflows/do-spec-validate.yml"
  push:
    branches: [main]
    paths:
      - "infra/do/**"
      - ".github/workflows/do-spec-validate.yml"

concurrency:
  group: do-spec-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate App Platform specs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          # No token: --schema-only below never calls the API.
          no_auth: true

      - name: Validate every spec
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          for spec in infra/do/*.yaml; do
            echo "-- validating $spec"
            if ! doctl apps spec validate --schema-only "$spec" >/dev/null; then
              echo "::error file=$spec::spec failed validation"
              fail=1
            fi
          done
          exit "$fail"
