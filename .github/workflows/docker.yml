name: Docker — Frontends

# Build, smoke-test, and (on main) publish each of the 4 frontend images.
# Matrix-build across hub + goldberry + ggg + nursery — local validation
# uses `make all-up` which builds the same 4 images via docker-compose.frontends.yml,
# so this keeps CI in lockstep with the canonical local-dev path.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-frontends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: ${{ matrix.app }} — build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false  # one app's failure shouldn't cancel the other 3
      matrix:
        include:
          # Storefronts — internal port 3001, commerce routes
          - app: goldberry
            internal_port: 3001
            image_name: ghcr.io/goldberry-playground/grove-goldberry
            qa_app: grove-goldberry-qa
            smoke_routes: "/ /cart /checkout"
            env_extra: |
              -e TENANT_ID=goldberry
              -e ODOO_URL=http://127.0.0.1:1
              -e ODOO_API_KEY=smoke-test
              -e GHOST_URL=http://127.0.0.1:1
              -e GHOST_CONTENT_KEY=smoke-test
          - app: ggg
            internal_port: 3001
            image_name: ghcr.io/goldberry-playground/grove-ggg
            qa_app: grove-ggg-qa
            smoke_routes: "/ /cart /checkout"
            env_extra: |
              -e TENANT_ID=ggg
              -e ODOO_URL=http://127.0.0.1:1
              -e ODOO_API_KEY=smoke-test
              -e GHOST_URL=http://127.0.0.1:1
              -e GHOST_CONTENT_KEY=smoke-test
          - app: nursery
            internal_port: 3001
            image_name: ghcr.io/goldberry-playground/grove-nursery
            qa_app: grove-nursery-qa
            smoke_routes: "/ /cart /checkout"
            env_extra: |
              -e TENANT_ID=nursery
              -e ODOO_URL=http://127.0.0.1:1
              -e ODOO_API_KEY=smoke-test
              -e GHOST_URL=http://127.0.0.1:1
              -e GHOST_CONTENT_KEY=smoke-test
          # Hub — internal port 3000, marketplace routes (no /cart — hub has no cart)
          - app: hub
            internal_port: 3000
            image_name: ghcr.io/goldberry-playground/grove-hub
            qa_app: grove-hub-qa
            smoke_routes: "/ /journal"
            env_extra: |
              -e GROVE_ODOO_URL=http://127.0.0.1:1
              -e HUB_GHOST_URL=http://127.0.0.1:1
              -e HUB_GHOST_CONTENT_API_KEY=smoke-test
              -e GROVE_REVALIDATE_SECRET=smoke-test-revalidate-secret
    env:
      TEST_TAG: test-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (local load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: ${{ matrix.image_name }}:${{ env.TEST_TAG }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          # Bake the assets CDN base into the client bundle (NEXT_PUBLIC_*
          # inlines at build time -- runtime env can't change it). Vanity
          # host live as of 2026-07-04: a Cloudflare Worker on the assets.*
          # route rewrites the hostname to the raw DO CDN endpoint on the
          # origin fetch (see odoocker infra/terraform/environments/assets/
          # for the full why -- proxied-CNAME, DO-delegation, and apex-A
          # approaches all dead-ended). The raw CDN hostname
          # (grove-assets.nyc3.cdn.digitaloceanspaces.com) remains valid as
          # an instant-rollback value if the Worker ever misbehaves. All 4
          # apps' next.config.ts allow both hostnames in remotePatterns.
          # Local `pnpm dev` keeps the /public/ fallback (env unset there).
          # RUM → grove-obs (GOL-281): non-secret NEXT_PUBLIC_* RUM values are
          # baked below; the browser-public RUM-ingest token is kept out of git
          # as the NEXT_PUBLIC_OO_RUM_CLIENT_TOKEN repo secret (empty on
          # untrusted forks → the OpenObserve sink stays disabled, no breakage).
          build-args: |
            NEXT_PUBLIC_ASSETS_URL=https://assets.gatheringatthegrove.com
            NEXT_PUBLIC_RUM_ENABLED=true
            NEXT_PUBLIC_RUM_ENV=production
            NEXT_PUBLIC_OO_RUM_SITE=rum.gatheringatthegrove.com
            NEXT_PUBLIC_OO_RUM_CLIENT_TOKEN=${{ secrets.NEXT_PUBLIC_OO_RUM_CLIENT_TOKEN }}

      # Run the container with placeholder backend URLs. Server Components catch
      # fetch errors and render the empty state; the routes in `smoke_routes`
      # don't depend on backend reachability — perfect for smoke testing.
      - name: Smoke test container
        env:
          # Defense-in-depth: ALL matrix values reach the shell via env vars,
          # never via ${{ }} interpolation in `run:`. Today matrix.app etc. are
          # hardcoded in the workflow above, so this is precautionary — but if
          # the matrix is ever made dynamic from a less-trusted source (PR
          # title, dispatch payload, etc.), this pattern prevents shell injection.
          APP: ${{ matrix.app }}
          IMAGE: ${{ matrix.image_name }}:${{ env.TEST_TAG }}
          INTERNAL_PORT: ${{ matrix.internal_port }}
          SMOKE_ROUTES: ${{ matrix.smoke_routes }}
          ENV_EXTRA: ${{ matrix.env_extra }}
        run: |
          # shellcheck disable=SC2086
          docker run -d --name "${APP}-smoke" \
            -p "${INTERNAL_PORT}:${INTERNAL_PORT}" \
            $ENV_EXTRA \
            "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:${INTERNAL_PORT}/" ; then
              echo "Container responding after ${i} polls"
              break
            fi
            sleep 2
          done

          fail=0
          for path in $SMOKE_ROUTES; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${INTERNAL_PORT}${path}")
            echo "  ${path}  ->  ${code}"
            case "$code" in
              2*) ;;
              *) fail=1 ;;
            esac
          done

          docker logs "${APP}-smoke"
          docker rm -f "${APP}-smoke" || true
          exit $fail

      # Blocking as of 2026-05-19. Same rationale as the pnpm audit gate in
      # ci.yml — soft-fail period drifted and missed a real backlog. If noisy,
      # raise severity to CRITICAL only, or add a Trivy ignore file
      # (.trivyignore) documenting accepted vulnerabilities with expiry dates.
      # Do not flip exit-code back to "0".
      - name: Scan image for high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image_name }}:${{ env.TEST_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ matrix.image_name }}
          TAG: ${{ env.TEST_TAG }}
          SHA: ${{ github.sha }}
        run: |
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker tag "$IMAGE:$TAG" "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"

      # ── Redeploy the QA app on the freshly-pushed image (GOL-397) ───────────
      #
      # WHY THIS STEP EXISTS: the grove-*-qa apps' specs carry
      # `image.deploy_on_push.enabled = true`, but that field is a DOCR-only
      # feature. Our images live in GHCR, and DO accepts the field on an
      # external-registry spec and then silently ignores it. Verified on
      # grove-hub-qa (GOL-396/GOL-397): NO deployment in the app's entire
      # history has cause `image push` — every one is `manual` or `app spec
      # updated`. So a GHCR push alone deploys nothing, and QA silently serves
      # a stale image. That trap already cost days on GOL-92, where QA showed a
      # 504 that was fixed in `main`.
      #
      # This step is inside the matrix leg on purpose: each app redeploys iff
      # its OWN image just pushed. A separate `needs:` job would be skipped
      # entirely when any one leg fails (fail-fast is false), re-creating the
      # exact silent-staleness gap for the legs that did push.
      #
      # `--wait` is deliberate: it makes a failed rollout turn this job red
      # instead of failing quietly, which is the whole point of the ticket.
      # A full QA rollout measured 75s against grove-hub-qa, so this costs
      # roughly a minute on top of a main build.

      # Resolve the DO token from 1Password (ADR-0001 Phase 3), same path
      # preview-up.yml uses. Deliberately NOT the repo's DIGITALOCEAN_ACCESS_TOKEN
      # secret: that one is only ever used for `doctl apps spec validate`, which
      # is a local parse and works with a read-only token — its scope is
      # unverifiable from here and could 403 on create-deployment. The op:// token
      # below is known-good for app writes because preview-up.yml provisions real
      # infrastructure with it.
      #
      # LEAST-PRIVILEGE FOLLOW-UP (GOL-399): this is the full-privilege infra
      # token. It is already reachable by any workflow in this repo via
      # OP_CI_SA_TOKEN (preview-up.yml loads it today), so using it here adds no
      # new exposure — but an app-write-only token would still be better. DO has
      # no API to mint scoped tokens (POST /v2/tokens → 403), so that needs a
      # human in the control panel. Swap the one op:// line below when it lands.
      # HARDENING (2026-07-22 SA-outage): a credential/infra failure in the
      # QA-redeploy leg must NOT red this check — build + smoke + push above
      # already succeeded, and the image IS on GHCR. A deleted/rotated
      # OP_CI_SA_TOKEN service account (which 403'd every main build until the
      # SA was recreated) is an OPS problem, not a code regression, so it
      # warns-and-skips instead of failing. A GENUINE deploy failure below
      # (app not found, rollout error) still hard-fails — that is GOL-397's
      # whole point and is preserved.
      #
      # Note the two distinct credential-failure modes, only one of which an
      # empty-token guard would catch:
      #   (a) token unset      -> `deploycreds` guard below
      #   (b) token set but DEAD (SA deleted -> load-secrets 403) -> caught by
      #       `continue-on-error` on the load step + the `dotoken.outcome` gate.
      # The 2026-07-22 outage was (b), which is why presence alone is not enough.
      - name: Check QA-redeploy credentials
        id: deploycreds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # Matrix value via env, never ${{ }} inside run: — same
          # defense-in-depth convention as the smoke-test + redeploy steps.
          OP_TOKEN: ${{ secrets.OP_CI_SA_TOKEN }}
          QA_APP: ${{ matrix.qa_app }}
        run: |
          if [ -z "$OP_TOKEN" ]; then
            echo "::warning title=QA redeploy skipped::OP_CI_SA_TOKEN is not set — ${QA_APP} keeps its previous image (:latest was still pushed to GHCR). Provision the CI service account, then re-run this workflow."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load DO token from 1Password
        id: dotoken
        if: steps.deploycreds.outputs.run == 'true'
        continue-on-error: true
        uses: 1password/load-secrets-action@v4
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_SA_TOKEN }}
          DIGITALOCEAN_ACCESS_TOKEN: op://Grove Prod/odoocker/DIGITALOCEAN_TOKEN
        with:
          export-env: true

      # The load step is continue-on-error so a dead SA cannot red the job.
      # If it failed, say so loudly and skip the deploy; the job still goes
      # green because the image shipped.
      - name: QA redeploy skipped — service account unavailable
        if: steps.deploycreds.outputs.run == 'true' && steps.dotoken.outcome == 'failure'
        env:
          QA_APP: ${{ matrix.qa_app }}
        run: |
          echo "::warning title=QA redeploy skipped::OP_CI_SA_TOKEN failed to resolve the DO token (service account deleted/rotated, or 1Password unreachable). ${QA_APP} keeps its previous image; :latest was still pushed to GHCR. Fix the SA and re-run this workflow to roll QA forward."

      - name: Install doctl
        if: steps.deploycreds.outputs.run == 'true' && steps.dotoken.outcome == 'success'
        uses: digitalocean/action-doctl@v2
        with:
          # From the 1Password step above (export-env wrote it to $GITHUB_ENV).
          token: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Redeploy ${{ matrix.qa_app }} onto the new image
        if: steps.deploycreds.outputs.run == 'true' && steps.dotoken.outcome == 'success'
        env:
          # Same defense-in-depth convention as the smoke-test step: matrix
          # values reach the shell via env, never via ${{ }} inside `run:`.
          QA_APP: ${{ matrix.qa_app }}
        run: |
          set -euo pipefail

          # Resolve by NAME rather than hardcoding an app ID: the QA apps are
          # not (yet) codified in infra/do/ — those specs describe the git-source
          # PROD apps — so an ID pinned here would rot silently if an app were
          # ever recreated. See GOL-398 for closing that drift.
          app_id=$(doctl apps list --format ID,Spec.Name --no-header \
            | awk -v n="$QA_APP" '$2 == n { print $1 }')

          if [[ -z "$app_id" ]]; then
            echo "::error::No DigitalOcean app named '${QA_APP}' — cannot redeploy. QA will serve a stale image until this is fixed."
            exit 1
          fi

          echo "Redeploying ${QA_APP} (${app_id}) onto the just-pushed :latest"
          doctl apps create-deployment "$app_id" --force-rebuild --wait

          # Report what actually went live, so the run log is the audit trail.
          # awk NR==1 rather than `head -1`: head closes the pipe after one line,
          # which can SIGPIPE doctl and trip `pipefail` into failing this step
          # after an already-successful deploy. awk drains stdin, so it can't.
          doctl apps list-deployments "$app_id" --format ID,Phase,Created --no-header \
            | awk 'NR == 1'
