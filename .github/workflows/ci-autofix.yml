# Bounded mechanical self-heal for agent PRs (GOL-308, from approved GOL-303).
#
# Problem this solves:
#   Agent PRs routinely go red on PURELY MECHANICAL checks — eslint
#   auto-fixable rules and out-of-date vitest snapshots. Today that stalls
#   an otherwise-good PR until a human/agent notices and re-pushes. This
#   workflow applies the mechanical fix automatically and pushes ONE commit
#   so the branch heals itself; genuine (non-mechanical) failures leave no
#   diff and stay red for the D3 CI failure router (E1, ci-failure-router.yml)
#   to escalate into a Paperclip fix issue.
#
# Why `pull_request` (not `workflow_run`):
#   Running the fixers means checking out and EXECUTING the PR's own tooling
#   (eslint config, vitest, install scripts). Doing that from a privileged
#   `workflow_run`/`pull_request_target` context with a write token is the
#   "untrusted checkout in a privileged context" vulnerability class (CodeQL
#   actions/untrusted-checkout, artifact/token poisoning). A plain
#   `pull_request` checkout of a SAME-REPO branch is the normal collaborator
#   model instead: fork PRs get a read-only token (and are skipped here), so
#   no untrusted fork code ever runs with write scope. This heals proactively
#   on every agent PR push rather than only after a red CI run.
#
# Guardrails:
#   - Same-repo PRs only (job `if`) — fork code never runs with a write token.
#   - Agent-authored PRs only (author == agenticos-developer App bot).
#   - ONE autofix commit per push: skip if the head commit is already a
#     "[ci-autofix]" commit (loop prevention).
#   - No diff after fixers -> nothing committed (non-mechanical failure).
#
# KNOWN LIMITATION (documented, not a bug):
#   Commits pushed with the automatic GITHUB_TOKEN do NOT re-trigger the
#   pull_request CI run (GitHub's recursion guard). So after a self-heal the
#   branch is correct but the required checks stay stale until the next agent
#   push or a maintainer "Re-run". Full hands-free needs the agent App
#   credentials as Actions secrets + actions/create-github-app-token to push —
#   tracked as a follow-up (governance/secrets = CEO).
name: CI autofix

on:
  pull_request:
    branches: [main]

# Least privilege: write contents to push the fix commit; read PRs to gate.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ci-autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    # Same-repo only. Fork PRs get a read-only GITHUB_TOKEN (can't push) and are
    # skipped so untrusted fork code never runs with a write-scoped token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Gate (agent author + loop guard)
        id: gate
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # NOTE: patterns are globs — brackets MUST be quoted so "[bot]" is a
          # literal, not a one-char class (which never matched the real login
          # "agenticos-developer[bot]" and silently skipped every agent PR).
          case "$AUTHOR" in
            agenticos-developer|"agenticos-developer[bot]"|app/agenticos-developer) ;;
            *)
              echo "PR author '$AUTHOR' is not the agent App bot; skipping."
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Loop guard: never stack a second autofix commit on top of our own.
          LAST_MSG=$(git log -1 --pretty=%s)
          if printf '%s' "$LAST_MSG" | grep -q '\[ci-autofix\]'; then
            echo "Head commit is already a [ci-autofix] commit; skipping to prevent loops."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.gate.outputs.proceed == 'true'
        uses: pnpm/action-setup@v6.0.9
        with:
          version: "9.15.0"

      - name: Setup Node.js
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply mechanical fixes (eslint --fix + vitest snapshot update)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          # Non-fatal: fixers may still exit non-zero on remaining NON-mechanical
          # errors. We only care about the diff they leave behind; anything that
          # can't be auto-fixed stays red and is E1's job.
          pnpm lint -- --fix || true
          pnpm test -- -u || true

      - name: Commit & push one fix commit (or skip if clean)
        if: steps.gate.outputs.proceed == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No mechanical fixes to apply — non-mechanical failure, leaving for the CI failure router (E1)."
            exit 0
          fi
          git commit \
            -m "chore(ci): apply mechanical lint/format/snapshot fixes [ci-autofix]" \
            -m "Automated bounded self-heal for an agent PR. One commit per push (GOL-308)." \
            -m "Co-authored-by: Paperclip <noreply@paperclip.ing>"
          git push origin "HEAD:$HEAD_REF"
          echo "::notice::Pushed one [ci-autofix] commit to $HEAD_REF. NOTE: GITHUB_TOKEN pushes do not re-trigger pull_request checks — the next agent push or a maintainer 'Re-run' will re-validate and let auto-merge fire."
