# Bounded mechanical self-heal for agent PRs (GOL-308, from approved GOL-303).
#
# Problem this solves:
#   Agent PRs routinely go red on PURELY MECHANICAL checks — eslint
#   auto-fixable rules and out-of-date vitest snapshots. Today that stalls
#   an otherwise-good PR until a human/agent notices and re-pushes. This
#   workflow applies the mechanical fix automatically and pushes ONE commit
#   so the branch heals itself; genuine (non-mechanical) failures are left
#   untouched for the D3 CI failure router (E1, ci-failure-router.yml) to
#   escalate into a Paperclip fix issue.
#
# Guardrails:
#   - Only agent-authored PRs (author == agenticos-developer App bot). Human
#     and external-fork PRs are never touched.
#   - ONE autofix commit per underlying push: if the PR head commit is already
#     a "[ci-autofix]" commit, this workflow no-ops (loop prevention).
#   - If the fixers produce no diff, nothing is committed — the failure was not
#     mechanical, so E1 owns it.
#   - Runs from the base-branch definition (workflow_run), so a PR cannot edit
#     this file to run arbitrary code with write scope. It only ever checks out
#     and runs the semi-trusted agent PR's own tooling (same trust boundary as
#     auto-approve.yml).
#
# KNOWN LIMITATION (documented, not a bug):
#   Commits pushed with the automatic GITHUB_TOKEN do NOT re-trigger the
#   pull_request CI run (GitHub's recursion guard). So after a self-heal the
#   branch is correct but the required checks stay stale until the next agent
#   push or a maintainer "Re-run". To make this fully hands-free, add the
#   agent App credentials as Actions secrets and swap the checkout/push token
#   to an actions/create-github-app-token mint — tracked as a follow-up.
name: CI autofix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Least privilege: write contents to push the fix commit; read PRs to gate.
permissions:
  contents: write
  pull-requests: read

concurrency:
  # Serialize per branch; never cancel — each attempt must settle.
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate (agent PR + loop guard)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author -q '.author.login')
          case "$AUTHOR" in
            app/agenticos-developer|agenticos-developer) ;;
            *)
              echo "PR #$PR author '$AUTHOR' is not the agent App bot; skipping."
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Loop guard: never stack a second autofix commit on top of our own.
          HEAD_MSG=$(gh api "repos/$REPO/commits/$HEAD_SHA" -q '.commit.message' | head -1)
          if printf '%s' "$HEAD_MSG" | grep -q '\[ci-autofix\]'; then
            echo "Head commit is already a [ci-autofix] commit; skipping to prevent loops."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HEAD_REF=$(gh pr view "$PR" --repo "$REPO" --json headRefName -q '.headRefName')
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_ref }}

      - name: Setup pnpm
        if: steps.gate.outputs.proceed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - name: Setup Node.js
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply mechanical fixes (eslint --fix + vitest snapshot update)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          # Non-fatal: fixers may still exit non-zero on remaining NON-mechanical
          # errors. We only care about the diff they leave behind; anything that
          # can't be auto-fixed stays red and is E1's job.
          pnpm lint -- --fix || true
          pnpm test -- -u || true

      - name: Commit & push one fix commit (or skip if clean)
        if: steps.gate.outputs.proceed == 'true'
        env:
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No mechanical fixes to apply — non-mechanical failure, leaving for the CI failure router (E1)."
            exit 0
          fi
          git commit \
            -m "chore(ci): apply mechanical lint/format/snapshot fixes [ci-autofix]" \
            -m "Automated bounded self-heal for an agent PR that failed CI on a mechanical check. One commit per push (GOL-308)." \
            -m "Co-authored-by: Paperclip <noreply@paperclip.ing>"
          git push origin "HEAD:$HEAD_REF"
          echo "::notice::Pushed one [ci-autofix] commit to $HEAD_REF. NOTE: GITHUB_TOKEN pushes do not re-trigger pull_request checks — the next agent push or a maintainer 'Re-run' will re-validate and let auto-merge fire."
