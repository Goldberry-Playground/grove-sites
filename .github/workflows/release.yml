name: Release — deploy Goldberry

# Triggered manually (workflow_dispatch) or by pushing a vX.Y.Z tag.
# Branch pushes never run this workflow.
#
# Deploy secrets are resolved from 1Password at run time via a service-account
# token (ADR-0001 Phase 3 — retires Infisical / static per-secret tokens),
# using the same `1password/load-secrets-action@v2` pattern as the preview
# workflows (grove-sites GOL-6 / PR #67). The `qa-deploy` vs `qa-prod` boundary
# is enforced with TWO distinct service-account tokens so a qa-deploy identity
# cannot resolve prod refs (GOL-202 scope #3):
#   sandbox    job → OP_CI_SA_TOKEN   → op://Grove Prod/grove-deploy/SANDBOX_*
#   production job → OP_PROD_SA_TOKEN  → op://Grove Prod/grove-deploy-prod/PROD_*
# NB: the `Grove Prod` vault name + item layout track GOL-268's provisioning
# decision; if that lands under a different vault name, both this file and the
# preview workflows get the same one-line sweep. HOLD until GOL-268 provisions
# the items + mints the two scoped SA tokens (and the production Environment
# keeps its required-reviewer gate). If a ref is unresolvable the load step
# fails loudly — the intended signal that provisioning is incomplete.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "sandbox"
        type: choice
        options:
          - sandbox
          - production
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.event.inputs.target || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/goldberry-playground/grove-goldberry

jobs:
  verify-image:
    name: Verify image is ready
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve image tag
        id: resolve
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "tag=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and smoke-test the image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.tag }}
        run: |
          docker pull "$IMAGE"
          docker run -d --name verify \
            -p 3001:3001 \
            -e ODOO_URL=http://127.0.0.1:1 \
            -e GHOST_URL=http://127.0.0.1:1 \
            -e GHOST_CONTENT_KEY=verify \
            "$IMAGE"

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3001/ ; then
              echo "Container responding"
              break
            fi
            sleep 2
          done

          fail=0
          for path in / /cart /checkout; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3001${path}")
            echo "  ${path}  ->  ${code}"
            case "$code" in 2*) ;; *) fail=1 ;; esac
          done

          docker rm -f verify || true
          exit $fail

  deploy-sandbox:
    name: Deploy to sandbox Droplet
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'sandbox'
    needs: verify-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: sandbox
      url: https://goldberry-sandbox.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deploy secrets come from 1Password, resolved with the qa-deploy
      # service-account token (OP_CI_SA_TOKEN). This identity is scoped to the
      # qa-deploy item and cannot resolve the qa-prod refs used by the
      # production job below. `export-env: true` places the resolved values in
      # $SSH_KEY / $SSH_HOST / $SSH_USER for the deploy + smoke steps.
      - name: Load sandbox deploy secrets (qa-deploy identity)
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_SA_TOKEN }}
          SSH_KEY:  op://Grove Prod/grove-deploy/SANDBOX_SSH_KEY
          SSH_HOST: op://Grove Prod/grove-deploy/SANDBOX_HOST
          SSH_USER: op://Grove Prod/grove-deploy/SANDBOX_SSH_USER

      - name: Deploy via SSH
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.verify-image.outputs.tag }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SANDBOX_HOST resolved empty from op://Grove Prod/grove-deploy/SANDBOX_HOST. Check the 1Password item + OP_CI_SA_TOKEN scope (GOL-268 provisioning)."
            exit 1
          fi
          mkdir -p ~/.ssh
          # GH Actions strips trailing newlines from secrets; OpenSSH requires
          # the key end with one. Use printf '%s\n' instead of echo to
          # preserve the trailing newline reliably across key formats. Same
          # pattern odoocker's qa-deploy.yml uses (audit fix 2026-06-29).
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Sanity-check the key is well-formed (catches secret-mangling)
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::SSH private key is malformed after writing. Check the secret value in repo Settings → Environments."
            exit 1
          fi
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          # $IMAGE is intentionally expanded on the runner before the remote
          # command is sent, so the host pulls the exact tag built this run.
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" \
            "docker pull $IMAGE \
              && docker stop grove-goldberry || true \
              && docker rm grove-goldberry || true \
              && docker run -d --name grove-goldberry \
                   --restart unless-stopped \
                   -p 3001:3001 \
                   --env-file /opt/grove/.env.frontends \
                   $IMAGE"

      - name: Smoke test deployed sandbox
        env:
          SANDBOX_URL: https://${{ env.SSH_HOST }}
        run: |
          for path in / /shop /cart /checkout; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SANDBOX_URL$path")
            echo "  $path  ->  $code"
            case "$code" in 2*) ;; *) exit 1 ;; esac
          done

  deploy-production:
    name: Deploy to production Droplet
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://goldberrygrove.farm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Production env keeps its required-reviewer approval gate (Settings →
      # Environments → production). Deploy secrets are resolved from 1Password
      # with the qa-prod service-account token (OP_PROD_SA_TOKEN) — a DISTINCT
      # identity from the sandbox job's OP_CI_SA_TOKEN, so a qa-deploy identity
      # can never reach these prod refs (GOL-202 scope #3).
      - name: Load production deploy secrets (qa-prod identity)
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PROD_SA_TOKEN }}
          SSH_KEY:  op://Grove Prod/grove-deploy-prod/PROD_SSH_KEY
          SSH_HOST: op://Grove Prod/grove-deploy-prod/PROD_HOST
          SSH_USER: op://Grove Prod/grove-deploy-prod/PROD_SSH_USER

      - name: Deploy via SSH
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.verify-image.outputs.tag }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::error::PROD_HOST resolved empty from op://Grove Prod/grove-deploy-prod/PROD_HOST. Check the 1Password item + OP_PROD_SA_TOKEN scope (GOL-268 provisioning)."
            exit 1
          fi
          mkdir -p ~/.ssh
          # GH Actions strips trailing newlines from secrets; OpenSSH requires
          # the key end with one. Use printf '%s\n' instead of echo to
          # preserve the trailing newline reliably across key formats. Same
          # pattern odoocker's qa-deploy.yml uses (audit fix 2026-06-29).
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Sanity-check the key is well-formed (catches secret-mangling)
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::SSH private key is malformed after writing. Check the secret value in repo Settings → Environments."
            exit 1
          fi
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # $IMAGE is intentionally expanded on the runner before the remote
          # command is sent, so the host pulls the exact tag built this run.
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" \
            "docker pull $IMAGE \
              && docker stop grove-goldberry || true \
              && docker rm grove-goldberry || true \
              && docker run -d --name grove-goldberry \
                   --restart unless-stopped \
                   -p 3001:3001 \
                   --env-file /opt/grove/.env.frontends \
                   $IMAGE"
