# CI failure router — shared implementation (GOL-1317 consolidation).
#
# The provenance-routing + auto-close logic used to be a ~130-line block
# copy-pasted into three repos (grove-sites, odoocker, grove-odoo-modules) and
# had already diverged. It lives here once and is consumed cross-repo as
#   uses: Goldberry-Playground/grove-sites/.github/actions/ci-failure-router@main
# so a fix lands in one place. Each caller keeps only its own event triggers and
# its repo-specific list of watched workflows.
#
# Modes (selected by the caller job's `if:` on the event):
#   route         — a watched workflow_run FAILED: sticky PR comment / mint issue
#   close-success — a watched workflow_run SUCCEEDED: close the matching issue,
#                   but ONLY if the green run is at-or-ahead of the recorded
#                   failing commit (GOL-1317: never close on a stale/older green)
#   branch-gone   — branch deleted or PR closed: reconcile stale issues
#   sweep         — scheduled/manual: close issues whose branch no longer exists
#   missing-checks — scheduled/manual (GOL-1958): a *required* status check that
#                   never STARTED (dropped trigger) is indistinguishable from one
#                   still running, so a PR hangs at "Expected — waiting for status"
#                   silently. This sweep is deliberately driven by `schedule` /
#                   `workflow_dispatch`, NOT `pull_request`, so it cannot be
#                   dropped by the same event class it detects. It reads the
#                   declared required contexts from `.github/required-checks.json`
#                   (never live protection — the reconcile leg owns that), then
#                   for each open non-draft PR on the protected branch flags any
#                   required context with NO check-run AND NO commit status of any
#                   state on a head SHA older than the grace window, and mints one
#                   deduped `ci-failure` issue per PR (mirrored to Paperclip).
name: CI failure router (shared)
description: Provenance-based CI-failure routing, recency-safe auto-close, and missing-required-check detection.

inputs:
  mode:
    description: route | close-success | branch-gone | sweep | missing-checks
    required: true
  github-token:
    description: Token used for issue/PR/commit-compare API calls.
    required: true
  # workflow_run fields (route + close-success)
  run-id:
    description: github.event.workflow_run.id
    required: false
    default: ""
  wf-name:
    description: github.event.workflow_run.name
    required: false
    default: ""
  head-branch:
    description: github.event.workflow_run.head_branch
    required: false
    default: ""
  head-sha:
    description: github.event.workflow_run.head_sha
    required: false
    default: ""
  run-url:
    description: github.event.workflow_run.html_url
    required: false
    default: ""
  run-event:
    description: github.event.workflow_run.event
    required: false
    default: ""
  run-attempt:
    description: github.event.workflow_run.run_attempt
    required: false
    default: ""
  run-started-at:
    description: github.event.workflow_run.run_started_at
    required: false
    default: ""
  # branch-gone fields
  gone-branch:
    description: deleted branch ref, or the closed PR's head ref
    required: false
    default: ""
  trigger:
    description: github.event_name for the branch-gone path (delete | pull_request)
    required: false
    default: ""
  pr-merged:
    description: github.event.pull_request.merged ("true"/"false") for PR-close
    required: false
    default: ""
  # missing-checks fields (GOL-1958)
  grace-minutes:
    description: >-
      How old (minutes) a PR head SHA must be before a missing required context
      is treated as a dropped trigger rather than normal queueing. Clears the
      window in which GitHub is still creating queued check-runs.
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: CI failure router (${{ inputs.mode }})
      uses: actions/github-script@v9
      env:
        MODE: ${{ inputs.mode }}
        RUN_ID: ${{ inputs.run-id }}
        WF_NAME: ${{ inputs.wf-name }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
        HEAD_SHA: ${{ inputs.head-sha }}
        RUN_URL: ${{ inputs.run-url }}
        RUN_EVENT: ${{ inputs.run-event }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
        RUN_STARTED_AT: ${{ inputs.run-started-at }}
        GONE_BRANCH: ${{ inputs.gone-branch }}
        TRIGGER: ${{ inputs.trigger }}
        PR_MERGED: ${{ inputs.pr-merged }}
        GRACE_MINUTES: ${{ inputs.grace-minutes }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const {
            MODE, RUN_ID, WF_NAME, HEAD_BRANCH, HEAD_SHA, RUN_URL, RUN_EVENT,
            RUN_ATTEMPT, RUN_STARTED_AT, GONE_BRANCH, TRIGGER, PR_MERGED,
            GRACE_MINUTES,
          } = process.env;
          const { owner, repo } = context.repo;

          // ── Markers ────────────────────────────────────────────────────
          // Human dedup marker (matched to mint/update/close) — unchanged.
          const failMarker = (wf, br) => `<!-- d3-ci-failure:${wf}:${br} -->`;
          // Machine-readable record of the *latest* failing run, so close-on-
          // success can verify recency (GOL-1317). Kept current on every repeat
          // failure so a stale/older green run can never satisfy the compare.
          const DATA_RE = /<!-- d3-ci-fail-data:(\{.*?\}) -->/;
          const dataMarker = (sha, started) =>
            `<!-- d3-ci-fail-data:${JSON.stringify({ sha: sha || "", started: started || "" })} -->`;

          function parseFailData(body) {
            const m = (body ?? "").match(DATA_RE);
            if (m) {
              try { return JSON.parse(m[1]); } catch { /* fall through */ }
            }
            // Legacy issues (minted before GOL-1317) have no data marker —
            // recover the short sha from the summary line so recency still works.
            const sm = (body ?? "").match(/@ `([0-9a-f]{7,40})`/);
            return sm ? { sha: sm[1], started: "" } : null;
          }

          // ────────────────────────────────────────────────────────────────
          if (MODE === "route") {
            const runId = Number(RUN_ID);
            const shortSha = HEAD_SHA.slice(0, 7);

            // Failed-job summary for the failed run.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: runId, filter: "latest", per_page: 100,
            });
            const failedJobs = jobs.filter((j) => j.conclusion === "failure");
            const jobLines = failedJobs
              .map((j) => `- [\`${j.name}\`](${j.html_url})`)
              .join("\n") || "- (no job-level detail — see the run)";

            // Owning PR, resolved by head branch against open PRs.
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: "open", head: `${owner}:${HEAD_BRANCH}`, per_page: 1,
            });
            const pr = prs[0] ?? null;

            // 3-strike lookback.
            const { data: history } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, branch: HEAD_BRANCH, status: "completed", per_page: 20,
            });
            const sameWf = history.workflow_runs
              .filter((r) => r.name === WF_NAME)
              .slice(0, 3);
            const threeStrikes =
              sameWf.length === 3 && sameWf.every((r) => r.conclusion === "failure");

            const summary = [
              `**Workflow:** ${WF_NAME} (attempt ${RUN_ATTEMPT})`,
              `**Branch:** \`${HEAD_BRANCH}\` @ \`${shortSha}\` (event: ${RUN_EVENT})`,
              `**Run:** ${RUN_URL}`,
              `**Failed jobs:**`,
              jobLines,
            ].join("\n");

            async function mintOrUpdateIssue(reason) {
              const marker = failMarker(WF_NAME, HEAD_BRANCH);
              const title = `CI failure: ${WF_NAME} on ${HEAD_BRANCH}`;
              const data = dataMarker(HEAD_SHA, RUN_STARTED_AT);
              const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: "open", labels: "ci-failure", per_page: 100,
              });
              const existing = openIssues.find((i) => (i.body ?? "").includes(marker));
              const body = [
                marker,
                data,
                `${reason}`,
                "",
                summary,
                "",
                "_Filed by the CI failure router; mirrored to Paperclip for analysis._",
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Failed again.\n\n${summary}`,
                });
                // Keep the recorded failing HEAD current so a green run of an
                // older commit can't satisfy the recency compare (GOL-1317).
                const oldBody = existing.body ?? "";
                const newBody = DATA_RE.test(oldBody)
                  ? oldBody.replace(DATA_RE, data)
                  : oldBody.replace(marker, `${marker}\n${data}`);
                if (newBody !== oldBody) {
                  await github.rest.issues.update({
                    owner, repo, issue_number: existing.number, body: newBody,
                  });
                }
                core.info(`Updated existing issue #${existing.number}`);
              } else {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: "ci-failure", color: "b60205",
                    description: "Minted by the CI failure router",
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                }
                const { data: issue } = await github.rest.issues.create({
                  owner, repo, title, body, labels: ["ci-failure"],
                });
                core.info(`Minted issue #${issue.number}`);
              }
            }

            if (!pr) {
              await mintOrUpdateIssue(`Ownerless failure — no open PR for \`${HEAD_BRANCH}\`.`);
              return;
            }

            const stickyMarker = `<!-- d3-ci-failure-router:${WF_NAME} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const sticky = comments.find((c) => (c.body ?? "").includes(stickyMarker));
            const strikeNote = threeStrikes
              ? "\n\n⚠️ **3 consecutive failures** of this workflow on this branch — escalated to an issue for Paperclip analysis."
              : "";
            const commentBody = [
              stickyMarker,
              `### ❌ ${WF_NAME} failed`,
              "",
              summary,
              strikeNote,
            ].join("\n");
            if (sticky) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: sticky.id, body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body: commentBody,
              });
            }
            core.info(`Sticky comment on PR #${pr.number}`);

            if (threeStrikes) {
              await mintOrUpdateIssue(
                `3-strike escalation from PR #${pr.number} — the owner appears stuck.`,
              );
            }
            return;
          }

          // ────────────────────────────────────────────────────────────────
          if (MODE === "close-success") {
            const marker = failMarker(WF_NAME, HEAD_BRANCH);
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            const match = openIssues.find((i) => (i.body ?? "").includes(marker));
            if (!match) {
              core.info(`No open ci-failure issue for ${WF_NAME} on ${HEAD_BRANCH}.`);
              return;
            }

            // GOL-1317: only close if this green run is NEWER than the failure
            // the issue records. A re-run of an older commit, or a slow parallel
            // run of an older commit finishing late, must NOT close a live break.
            const fd = parseFailData(match.body);
            if (!fd || !fd.sha) {
              core.info(`#${match.number}: no recorded failing commit; skipping auto-close to avoid dropping a live failure.`);
              return;
            }

            let shouldClose = false;
            let why = "";
            try {
              const cmp = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${fd.sha}...${HEAD_SHA}`,
              });
              const status = cmp.data.status; // ahead | behind | identical | diverged
              // ahead     → green commit is a descendant of the failure  → newer
              // identical → the exact failing commit now passes (re-run)  → resolved
              // behind    → green commit is an ANCESTOR of the failure     → stale
              // diverged  → unrelated line                                 → ambiguous
              shouldClose = status === "ahead" || status === "identical";
              why = `commit compare ${fd.sha.slice(0, 7)}...${HEAD_SHA.slice(0, 7)} = ${status}`;
            } catch (e) {
              // Compare can fail if the recorded sha was force-pushed away.
              // Fall back to run_started_at when we have both timestamps.
              if (fd.started && RUN_STARTED_AT) {
                shouldClose =
                  new Date(RUN_STARTED_AT).getTime() >= new Date(fd.started).getTime();
                why = `compare unavailable (${e.status}); run_started_at ${shouldClose ? ">=" : "<"} recorded failure`;
              } else {
                shouldClose = false;
                why = `compare unavailable (${e.status}) and no timestamp fallback`;
              }
            }

            if (!shouldClose) {
              core.info(`#${match.number}: green run is not newer than the recorded failure (${why}); leaving it open.`);
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: match.number,
              body: [
                `✅ Resolved — a later run of **${WF_NAME}** on \`${HEAD_BRANCH}\` succeeded at or ahead of the recorded failure.`,
                "",
                RUN_URL,
                "",
                `<sub>Recency check: ${why}.</sub>`,
                "",
                "_Auto-closed by the CI failure router._",
              ].join("\n"),
            });
            await github.rest.issues.update({
              owner, repo, issue_number: match.number,
              state: "closed", state_reason: "completed",
            });
            core.info(`Closed #${match.number} on green run (${why}).`);
            return;
          }

          // ────────────────────────────────────────────────────────────────
          if (MODE === "branch-gone") {
            if (!GONE_BRANCH) { core.info("No branch to reconcile."); return; }
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            const matches = openIssues.filter((i) => {
              const m = (i.body ?? "").match(/<!-- d3-ci-failure:(.+):(.+?) -->/);
              return m && m[2] === GONE_BRANCH;
            });
            if (!matches.length) {
              core.info(`No ci-failure issues for branch ${GONE_BRANCH}.`);
              return;
            }

            let reason, stateReason;
            if (TRIGGER === "delete") {
              reason = `branch \`${GONE_BRANCH}\` was deleted`;
              stateReason = "not_planned";
            } else {
              // pull_request closed. GOL-1317: a PR closed UNMERGED whose branch
              // still exists leaves the failure live — do NOT close then.
              if (PR_MERGED === "true") {
                reason = `the PR for \`${GONE_BRANCH}\` was merged`;
                stateReason = "completed";
              } else {
                let exists = true;
                try {
                  await github.rest.repos.getBranch({ owner, repo, branch: GONE_BRANCH });
                } catch (e) {
                  if (e.status === 404) exists = false; else throw e;
                }
                if (exists) {
                  core.info(`PR for ${GONE_BRANCH} closed unmerged but the branch still exists; leaving ${matches.length} issue(s) open.`);
                  return;
                }
                reason = `the PR for \`${GONE_BRANCH}\` was closed unmerged and the branch was deleted`;
                stateReason = "not_planned";
              }
            }

            for (const m of matches) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: m.number,
                body: `🧹 Auto-closed — ${reason}, so this CI-failure issue is stale.\n\n_Auto-closed by the CI failure router._`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: m.number,
                state: "closed", state_reason: stateReason,
              });
              core.info(`Closed #${m.number} (${reason}).`);
            }
            return;
          }

          // ────────────────────────────────────────────────────────────────
          if (MODE === "sweep") {
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            let closed = 0;
            for (const issue of openIssues) {
              const m = (issue.body ?? "").match(/<!-- d3-ci-failure:(.+):(.+?) -->/);
              if (!m) continue;
              const branch = m[2];
              // Long-lived branches always exist; their failures are real.
              if (["main", "master", "develop"].includes(branch)) continue;
              let exists = true;
              try {
                await github.rest.repos.getBranch({ owner, repo, branch });
              } catch (e) {
                if (e.status === 404) exists = false; else throw e;
              }
              if (exists) continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `🧹 Auto-closed by sweep — branch \`${branch}\` no longer exists.\n\n_Auto-closed by the CI failure router._`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: "closed", state_reason: "not_planned",
              });
              closed++;
              core.info(`Swept #${issue.number} (branch ${branch} gone).`);
            }
            core.info(`Sweep closed ${closed} issue(s).`);
            return;
          }

          // ────────────────────────────────────────────────────────────────
          // GOL-1958: detect required checks that never STARTED on an open PR.
          if (MODE === "missing-checks") {
            const graceMin = Number(GRACE_MINUTES || "20");
            const nowMs = Date.now();

            // Declared required contexts + the protected branch they gate.
            // Read from the repo file, NOT live protection: the reconcile leg of
            // required-checks-audit already owns declared-vs-live drift. Reading
            // it here would duplicate that and need an admin token we don't want
            // in a frequent sweep.
            let requiredContexts = [];
            let baseBranch = null;
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: ".github/required-checks.json",
              });
              const json = JSON.parse(Buffer.from(file.content, "base64").toString("utf8"));
              requiredContexts = json.required_contexts || [];
              baseBranch = json.branch || null;
            } catch (e) {
              core.warning(`No readable .github/required-checks.json (${e.status}); nothing to sweep.`);
              return;
            }
            if (!requiredContexts.length || !baseBranch) {
              core.info("No required contexts declared; nothing to sweep.");
              return;
            }

            // Open, non-draft PRs targeting the protected branch.
            const allOpen = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", base: baseBranch, per_page: 100,
            });
            const prs = allOpen.filter((p) => !p.draft);
            const evaluated = new Set(prs.map((p) => p.number));

            // Dedup markers (one issue per PR; body records the head SHA so a
            // re-run for the same PR+SHA is a strict no-op — acceptance #5).
            const marker = (num) => `<!-- d3-missing-checks:PR${num} -->`;
            const DATA_RE = /<!-- d3-missing-checks-data:(\{.*?\}) -->/;
            const dataMarker = (sha) =>
              `<!-- d3-missing-checks-data:${JSON.stringify({ sha: sha || "" })} -->`;
            const recordedSha = (body) => {
              const m = (body ?? "").match(DATA_RE);
              if (m) { try { return JSON.parse(m[1]).sha; } catch { /* */ } }
              return null;
            };

            // These sweeps mint `ci-failure`-labelled issues so the GitHub App
            // mirrors them to Paperclip — same notification path as the router.
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            const missingIssueFor = (num) =>
              openIssues.find((i) => (i.body ?? "").includes(marker(num)));

            const flagged = new Set(); // PR numbers currently flagged

            for (const pr of prs) {
              const sha = pr.head.sha;

              // Union of check-run NAMES and commit-status CONTEXTS on the head
              // SHA. grove-sites' `Lighthouse CI` is a commit status, not a
              // check-run — reading only check-runs would false-positive it
              // (acceptance #3). A context in ANY state (queued/in_progress/
              // completed) counts as present, so queued work is never flagged
              // (acceptance #4).
              const present = new Set();
              const crResp = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100,
              });
              for (const cr of crResp.data.check_runs || []) present.add(cr.name);
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                { owner, repo, ref: sha, per_page: 100 },
              );
              for (const s of statuses) present.add(s.context);

              const missing = requiredContexts.filter((c) => !present.has(c));
              if (!missing.length) continue;

              // Grace: only flag once the head SHA is older than the window in
              // which GitHub would normally have created queued check-runs.
              let commitDate = null;
              try {
                const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
                commitDate = commit.commit.committer?.date || commit.commit.author?.date || null;
              } catch (e) {
                core.info(`PR #${pr.number}: cannot read head commit (${e.status}); skipping to avoid a false positive.`);
                continue;
              }
              if (!commitDate) continue;
              const ageMin = (nowMs - new Date(commitDate).getTime()) / 60000;
              if (ageMin < graceMin) {
                core.info(`PR #${pr.number}: head ${sha.slice(0, 7)} is ${ageMin.toFixed(1)}m old (< ${graceMin}m grace); missing [${missing.join(", ")}] — within queue window, skipping.`);
                continue;
              }

              flagged.add(pr.number);

              const remediation = [
                "**Remediation** — the reliable way to regenerate a dropped `pull_request` event is to close and reopen the PR:",
                "```bash",
                `gh pr close ${pr.number} --repo ${owner}/${repo} && gh pr reopen ${pr.number} --repo ${owner}/${repo}`,
                "```",
                "Close/reopen re-fires `pull_request`, so the missing workflow(s) run on the current head. This is a mutating action on the PR — safe for an agent-authored PR, but if a human is mid-review, coordinate first (GOL-1958 keeps auto-remediation out of scope for now).",
              ].join("\n");
              const summary = [
                `**PR:** [#${pr.number} — ${pr.title}](${pr.html_url})`,
                `**Head SHA:** \`${sha}\` (age ${ageMin.toFixed(0)}m, past the ${graceMin}m grace window)`,
                `**Missing required context(s):** ${missing.map((c) => `\`${c}\``).join(", ")}`,
                "",
                `These contexts are **required** by branch protection (\`.github/required-checks.json\`, branch \`${baseBranch}\`) but have **no check-run and no commit status of any state** on the head SHA. That is a dropped trigger, not a slow run — the PR will hang at "Expected — waiting for status" until it is cleared.`,
                "",
                remediation,
              ].join("\n");

              const existing = missingIssueFor(pr.number);
              if (existing) {
                if (recordedSha(existing.body) === sha) {
                  core.info(`PR #${pr.number}: issue #${existing.number} already open for head ${sha.slice(0, 7)} — no-op (dedup).`);
                  continue;
                }
                // Head advanced but the context is still missing — keep one
                // issue, refresh its recorded SHA, add a note.
                const oldBody = existing.body ?? "";
                const newBody = DATA_RE.test(oldBody)
                  ? oldBody.replace(DATA_RE, dataMarker(sha))
                  : `${oldBody}\n${dataMarker(sha)}`;
                if (newBody !== oldBody) {
                  await github.rest.issues.update({
                    owner, repo, issue_number: existing.number, body: newBody,
                  });
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Head advanced to \`${sha}\` and the required context(s) are still missing.\n\n${summary}`,
                });
                core.info(`Updated missing-checks issue #${existing.number} for PR #${pr.number}.`);
              } else {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: "ci-failure", color: "b60205",
                    description: "Minted by the CI failure router",
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                }
                const body = [
                  marker(pr.number),
                  dataMarker(sha),
                  summary,
                  "",
                  "_Filed by the CI failure router (missing-required-check sweep, GOL-1958); mirrored to Paperclip for analysis._",
                ].join("\n");
                const { data: issue } = await github.rest.issues.create({
                  owner, repo,
                  title: `Missing required check on PR #${pr.number}: ${missing.join(", ")}`,
                  body, labels: ["ci-failure"],
                });
                core.info(`Minted missing-checks issue #${issue.number} for PR #${pr.number}.`);
              }
            }

            // Self-heal: close any open missing-checks issue whose PR is no
            // longer flagged — the checks now report, or the PR left the set
            // (closed / drafted / retargeted).
            for (const issue of openIssues) {
              const m = (issue.body ?? "").match(/<!-- d3-missing-checks:PR(\d+) -->/);
              if (!m) continue;
              const num = Number(m[1]);
              if (flagged.has(num)) continue;
              const reason = evaluated.has(num)
                ? `all required contexts now report on PR #${num}'s head`
                : `PR #${num} is no longer an open non-draft PR on \`${baseBranch}\``;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `✅ Resolved — ${reason}.\n\n_Auto-closed by the missing-required-check sweep._`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: "closed", state_reason: "completed",
              });
              core.info(`Closed missing-checks issue #${issue.number} (${reason}).`);
            }
            return;
          }

          core.setFailed(`Unknown mode: ${MODE}`);
