# CI failure router — shared implementation (GOL-1317 consolidation).
#
# The provenance-routing + auto-close logic used to be a ~130-line block
# copy-pasted into three repos (grove-sites, odoocker, grove-odoo-modules) and
# had already diverged. It lives here once and is consumed cross-repo as
#   uses: Goldberry-Playground/grove-sites/.github/actions/ci-failure-router@main
# so a fix lands in one place. Each caller keeps only its own event triggers and
# its repo-specific list of watched workflows.
#
# Modes (selected by the caller job's `if:` on the event):
#   route         — a watched workflow_run FAILED: sticky PR comment / mint issue.
#                   GOL-2807: an ownerless failure on a merge-queue branch whose
#                   failing-job set matches the issue already open for its base
#                   branch is recorded there instead of minting a duplicate —
#                   the queue names a fresh branch per merge, so a branch-tip-red
#                   gate used to mint one issue per merge.
#   close-success — a watched workflow_run SUCCEEDED: close the matching issue,
#                   but ONLY if the green run is at-or-ahead of the recorded
#                   failing commit (GOL-1317: never close on a stale/older green)
#   branch-gone   — branch deleted or PR closed: reconcile stale issues
#   sweep         — scheduled/manual: close issues whose branch no longer exists
#   missing-checks — scheduled/manual (GOL-1958): a *required* status check that
#                   never STARTED (dropped trigger) is indistinguishable from one
#                   still running, so a PR hangs at "Expected — waiting for status"
#                   silently. GOL-2732: it also reads workflow runs on the head
#                   SHA, because a run parked at `action_required` (an approval
#                   gate, typically because the head was moved under the ambient
#                   GITHUB_TOKEN) publishes no check-run and no status either —
#                   byte-identical to a dropped trigger unless you look. GOL-2850:
#                   it also reads the PR timeline, because a base retargeted
#                   AFTER the head commit (`automatic_base_change_succeeded`,
#                   e.g. a stacked PR whose parent merged) leaves the same empty
#                   head — the branch-filtered workflows were correctly skipped
#                   at push time and no event ever re-fires them. This sweep is deliberately driven by `schedule` /
#                   `workflow_dispatch`, NOT `pull_request`, so it cannot be
#                   dropped by the same event class it detects. It reads the
#                   declared required contexts from `.github/required-checks.json`
#                   (never live protection — the reconcile leg owns that), then
#                   for each open non-draft PR on the protected branch flags any
#                   required context with NO check-run AND NO commit status of any
#                   state on a head SHA older than the grace window, and mints one
#                   deduped `ci-failure` issue per PR (mirrored to Paperclip).
name: CI failure router (shared)
description: Provenance-based CI-failure routing, recency-safe auto-close, and missing-required-check detection.

inputs:
  mode:
    description: route | close-success | branch-gone | sweep | missing-checks
    required: true
  github-token:
    description: Token used for issue/PR/commit-compare API calls.
    required: true
  # workflow_run fields (route + close-success)
  run-id:
    description: github.event.workflow_run.id
    required: false
    default: ""
  wf-name:
    description: github.event.workflow_run.name
    required: false
    default: ""
  head-branch:
    description: github.event.workflow_run.head_branch
    required: false
    default: ""
  head-sha:
    description: github.event.workflow_run.head_sha
    required: false
    default: ""
  run-url:
    description: github.event.workflow_run.html_url
    required: false
    default: ""
  run-event:
    description: github.event.workflow_run.event
    required: false
    default: ""
  run-attempt:
    description: github.event.workflow_run.run_attempt
    required: false
    default: ""
  run-started-at:
    description: github.event.workflow_run.run_started_at
    required: false
    default: ""
  # branch-gone fields
  gone-branch:
    description: deleted branch ref, or the closed PR's head ref
    required: false
    default: ""
  trigger:
    description: github.event_name for the branch-gone path (delete | pull_request)
    required: false
    default: ""
  pr-merged:
    description: github.event.pull_request.merged ("true"/"false") for PR-close
    required: false
    default: ""
  # missing-checks fields (GOL-1958)
  grace-minutes:
    description: >-
      How old (minutes) a PR head SHA must be before a missing required context
      is treated as a dropped trigger rather than normal queueing. Clears the
      window in which GitHub is still creating queued check-runs.
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: CI failure router (${{ inputs.mode }})
      uses: actions/github-script@v9
      env:
        MODE: ${{ inputs.mode }}
        RUN_ID: ${{ inputs.run-id }}
        WF_NAME: ${{ inputs.wf-name }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
        HEAD_SHA: ${{ inputs.head-sha }}
        RUN_URL: ${{ inputs.run-url }}
        RUN_EVENT: ${{ inputs.run-event }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
        RUN_STARTED_AT: ${{ inputs.run-started-at }}
        GONE_BRANCH: ${{ inputs.gone-branch }}
        TRIGGER: ${{ inputs.trigger }}
        PR_MERGED: ${{ inputs.pr-merged }}
        GRACE_MINUTES: ${{ inputs.grace-minutes }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const {
            MODE, RUN_ID, WF_NAME, HEAD_BRANCH, HEAD_SHA, RUN_URL, RUN_EVENT,
            RUN_ATTEMPT, RUN_STARTED_AT, GONE_BRANCH, TRIGGER, PR_MERGED,
            GRACE_MINUTES,
          } = process.env;
          const { owner, repo } = context.repo;

          // ── Markers ────────────────────────────────────────────────────
          // Human dedup marker (matched to mint/update/close) — unchanged.
          const failMarker = (wf, br) => `<!-- d3-ci-failure:${wf}:${br} -->`;
          // The merge queue runs CI on a throwaway branch whose name carries
          // the PR number and the base sha — a NEW name per merge, so the
          // (workflow, branch) dedup marker above can never match twice.
          // Returns the base branch it was queued onto, or null.
          const QUEUE_BRANCH_RE = /^gh-readonly-queue\/(.+)\/pr-\d+-[0-9a-f]{7,40}$/;
          const queueBaseOf = (br) => {
            const m = QUEUE_BRANCH_RE.exec(br ?? "");
            return m ? m[1] : null;
          };
          // Failing-job names read back out of an issue body, in the exact
          // shape `jobLines` below writes them.
          const parseFailedJobs = (body) =>
            [...(body ?? "").matchAll(/^- \[`(.+?)`\]\(/gm)].map((m) => m[1]);
          // Set equality over job names. Empty on either side → NOT equal:
          // a run-level failure with no job detail must never dedupe onto a
          // job-level one (or vice versa).
          const sameJobSet = (a, b) => {
            const A = [...new Set(a)].sort();
            const B = [...new Set(b)].sort();
            if (!A.length || !B.length) return false;
            return A.length === B.length && A.every((x, i) => x === B[i]);
          };
          // Machine-readable record of the *latest* failing run, so close-on-
          // success can verify recency (GOL-1317). Kept current on every repeat
          // failure so a stale/older green run can never satisfy the compare.
          const DATA_RE = /<!-- d3-ci-fail-data:(\{.*?\}) -->/;
          const dataMarker = (sha, started) =>
            `<!-- d3-ci-fail-data:${JSON.stringify({ sha: sha || "", started: started || "" })} -->`;

          function parseFailData(body) {
            const m = (body ?? "").match(DATA_RE);
            if (m) {
              try { return JSON.parse(m[1]); } catch { /* fall through */ }
            }
            // Legacy issues (minted before GOL-1317) have no data marker —
            // recover the short sha from the summary line so recency still works.
            const sm = (body ?? "").match(/@ `([0-9a-f]{7,40})`/);
            return sm ? { sha: sm[1], started: "" } : null;
          }

          // ────────────────────────────────────────────────────────────────
          if (MODE === "route") {
            const runId = Number(RUN_ID);
            const shortSha = HEAD_SHA.slice(0, 7);

            // Failed-job summary for the failed run.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: runId, filter: "latest", per_page: 100,
            });
            const failedJobs = jobs.filter((j) => j.conclusion === "failure");
            const jobLines = failedJobs
              .map((j) => `- [\`${j.name}\`](${j.html_url})`)
              .join("\n") || "- (no job-level detail — see the run)";

            // ── Known-red gate allowlist (GOL-1957) ──────────────────────
            // Temporary noise-suppression valve. When a run's ONLY failing
            // jobs are known-red, NON-required gates already tracked by an
            // open issue, do NOT mint/escalate a ci-failure issue: the merge
            // queue re-runs CI on a fresh, unique branch per merge, so a
            // permanently-red non-required gate mints one ownerless issue —
            // and burns one DevOps triage heartbeat — per merge. This does
            // NOT weaken merge gating: required checks are untouched; only
            // the noise router is silenced. Each entry is scoped by repo +
            // exact job name (as reported by listJobsForWorkflowRun) and
            // references its tracking issue. REMOVE an entry the moment its
            // tracking issue lands green — a stale entry masks a real,
            // freshly-broken gate.
            const KNOWN_RED_GATES = [
              {
                repo: "grove-odoo-modules",
                job: "Install + test module against Odoo 19",
                tracking: "GOL-1949", // grove_headless Odoo-19 suite red since #145 (GOL-1941)
              },
            ];
            const isKnownRed = (job) =>
              KNOWN_RED_GATES.some((g) => g.repo === repo && g.job === job.name);
            // True only when there IS a failure and every failing job is a
            // tracked known-red gate. An empty failedJobs set (run-level
            // failure with no job detail) is NOT suppressed.
            const onlyKnownRed =
              failedJobs.length > 0 && failedJobs.every(isKnownRed);
            const knownRedRefs = [
              ...new Set(
                failedJobs.filter(isKnownRed).map(
                  (j) => KNOWN_RED_GATES.find((g) => g.repo === repo && g.job === j.name).tracking,
                ),
              ),
            ].join(", ");

            // Owning PR, resolved by head branch against open PRs.
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: "open", head: `${owner}:${HEAD_BRANCH}`, per_page: 1,
            });
            const pr = prs[0] ?? null;

            // 3-strike lookback.
            const { data: history } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, branch: HEAD_BRANCH, status: "completed", per_page: 20,
            });
            const sameWf = history.workflow_runs
              .filter((r) => r.name === WF_NAME)
              .slice(0, 3);
            const threeStrikes =
              sameWf.length === 3 && sameWf.every((r) => r.conclusion === "failure");

            const summary = [
              `**Workflow:** ${WF_NAME} (attempt ${RUN_ATTEMPT})`,
              `**Branch:** \`${HEAD_BRANCH}\` @ \`${shortSha}\` (event: ${RUN_EVENT})`,
              `**Run:** ${RUN_URL}`,
              `**Failed jobs:**`,
              jobLines,
            ].join("\n");

            async function mintOrUpdateIssue(reason) {
              const marker = failMarker(WF_NAME, HEAD_BRANCH);
              const title = `CI failure: ${WF_NAME} on ${HEAD_BRANCH}`;
              const data = dataMarker(HEAD_SHA, RUN_STARTED_AT);
              const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: "open", labels: "ci-failure", per_page: 100,
              });
              const existing = openIssues.find((i) => (i.body ?? "").includes(marker));
              const body = [
                marker,
                data,
                `${reason}`,
                "",
                summary,
                "",
                "_Filed by the CI failure router; mirrored to Paperclip for analysis._",
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Failed again.\n\n${summary}`,
                });
                // Keep the recorded failing HEAD current so a green run of an
                // older commit can't satisfy the recency compare (GOL-1317).
                const oldBody = existing.body ?? "";
                const newBody = DATA_RE.test(oldBody)
                  ? oldBody.replace(DATA_RE, data)
                  : oldBody.replace(marker, `${marker}\n${data}`);
                if (newBody !== oldBody) {
                  await github.rest.issues.update({
                    owner, repo, issue_number: existing.number, body: newBody,
                  });
                }
                core.info(`Updated existing issue #${existing.number}`);
              } else {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: "ci-failure", color: "b60205",
                    description: "Minted by the CI failure router",
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                }
                const { data: issue } = await github.rest.issues.create({
                  owner, repo, title, body, labels: ["ci-failure"],
                });
                core.info(`Minted issue #${issue.number}`);
              }
            }

            if (!pr) {
              if (onlyKnownRed) {
                core.notice(
                  `Suppressed ownerless ci-failure issue on \`${HEAD_BRANCH}\`: the only failing job(s) are known-red gate(s) tracked by ${knownRedRefs} (GOL-1957). No issue minted.`,
                );
                return;
              }

              // ── Merge-queue duplicate suppression (GOL-2807) ───────────
              // A gate that is red on the branch tip is red for every commit
              // built from it, so the merge queue re-discovers it on each
              // throwaway queue branch — one fresh ownerless issue (and one
              // DevOps triage heartbeat) per merge, on top of the issue
              // already open for the base branch. GOL-2806 (`main`) and
              // GOL-2807 (`gh-readonly-queue/main/pr-900-…`) were four
              // minutes apart: the same two CVEs, the same one-line fix.
              //
              // When a queue-branch failure has the SAME failing-job set as
              // the open issue for its base branch, it IS that failure seen
              // again through the queue → record it there and mint nothing.
              // A DIFFERENT job set means the queue build broke something the
              // base branch didn't (e.g. a semantic conflict between two
              // queued PRs) and still earns its own issue.
              const queueBase = queueBaseOf(HEAD_BRANCH);
              if (queueBase && failedJobs.length > 0) {
                const baseMarker = failMarker(WF_NAME, queueBase);
                const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                  owner, repo, state: "open", labels: "ci-failure", per_page: 100,
                });
                const baseIssue = openIssues.find((i) => (i.body ?? "").includes(baseMarker));
                if (baseIssue && sameJobSet(parseFailedJobs(baseIssue.body), failedJobs.map((j) => j.name))) {
                  // Comment only — do NOT refresh the data marker. The queue
                  // sha is not an ancestor of the base branch, so recording it
                  // would make close-on-success compare `diverged` and leave
                  // the issue open forever once the gate went green (GOL-1317).
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: baseIssue.number,
                    body: [
                      `Failed again through the merge queue, with the same failing job(s) as this issue — no duplicate issue was minted (GOL-2807).`,
                      "",
                      summary,
                    ].join("\n"),
                  });
                  core.notice(
                    `Suppressed duplicate ownerless ci-failure issue for queue branch \`${HEAD_BRANCH}\`: same failing job(s) as open issue #${baseIssue.number} for \`${queueBase}\` (GOL-2807).`,
                  );
                  return;
                }
              }

              await mintOrUpdateIssue(`Ownerless failure — no open PR for \`${HEAD_BRANCH}\`.`);
              return;
            }

            const stickyMarker = `<!-- d3-ci-failure-router:${WF_NAME} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const sticky = comments.find((c) => (c.body ?? "").includes(stickyMarker));
            const strikeNote = threeStrikes
              ? "\n\n⚠️ **3 consecutive failures** of this workflow on this branch — escalated to an issue for Paperclip analysis."
              : "";
            const commentBody = [
              stickyMarker,
              `### ❌ ${WF_NAME} failed`,
              "",
              summary,
              strikeNote,
            ].join("\n");
            if (sticky) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: sticky.id, body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body: commentBody,
              });
            }
            core.info(`Sticky comment on PR #${pr.number}`);

            if (threeStrikes && onlyKnownRed) {
              // Every strike is the same known-red gate — escalating just
              // re-files noise the owner can't fix. Suppress (GOL-1957).
              core.notice(
                `Suppressed 3-strike escalation on PR #${pr.number}: the only failing job(s) are known-red gate(s) tracked by ${knownRedRefs} (GOL-1957).`,
              );
            } else if (threeStrikes) {
              await mintOrUpdateIssue(
                `3-strike escalation from PR #${pr.number} — the owner appears stuck.`,
              );
            }
            return;
          }

          // ────────────────────────────────────────────────────────────────
          if (MODE === "close-success") {
            const marker = failMarker(WF_NAME, HEAD_BRANCH);
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            const match = openIssues.find((i) => (i.body ?? "").includes(marker));
            if (!match) {
              core.info(`No open ci-failure issue for ${WF_NAME} on ${HEAD_BRANCH}.`);
              return;
            }

            // GOL-1317: only close if this green run is NEWER than the failure
            // the issue records. A re-run of an older commit, or a slow parallel
            // run of an older commit finishing late, must NOT close a live break.
            const fd = parseFailData(match.body);
            if (!fd || !fd.sha) {
              core.info(`#${match.number}: no recorded failing commit; skipping auto-close to avoid dropping a live failure.`);
              return;
            }

            let shouldClose = false;
            let why = "";
            try {
              const cmp = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${fd.sha}...${HEAD_SHA}`,
              });
              const status = cmp.data.status; // ahead | behind | identical | diverged
              // ahead     → green commit is a descendant of the failure  → newer
              // identical → the exact failing commit now passes (re-run)  → resolved
              // behind    → green commit is an ANCESTOR of the failure     → stale
              // diverged  → unrelated line                                 → ambiguous
              shouldClose = status === "ahead" || status === "identical";
              why = `commit compare ${fd.sha.slice(0, 7)}...${HEAD_SHA.slice(0, 7)} = ${status}`;
            } catch (e) {
              // Compare can fail if the recorded sha was force-pushed away.
              // Fall back to run_started_at when we have both timestamps.
              if (fd.started && RUN_STARTED_AT) {
                shouldClose =
                  new Date(RUN_STARTED_AT).getTime() >= new Date(fd.started).getTime();
                why = `compare unavailable (${e.status}); run_started_at ${shouldClose ? ">=" : "<"} recorded failure`;
              } else {
                shouldClose = false;
                why = `compare unavailable (${e.status}) and no timestamp fallback`;
              }
            }

            if (!shouldClose) {
              core.info(`#${match.number}: green run is not newer than the recorded failure (${why}); leaving it open.`);
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: match.number,
              body: [
                `✅ Resolved — a later run of **${WF_NAME}** on \`${HEAD_BRANCH}\` succeeded at or ahead of the recorded failure.`,
                "",
                RUN_URL,
                "",
                `<sub>Recency check: ${why}.</sub>`,
                "",
                "_Auto-closed by the CI failure router._",
              ].join("\n"),
            });
            await github.rest.issues.update({
              owner, repo, issue_number: match.number,
              state: "closed", state_reason: "completed",
            });
            core.info(`Closed #${match.number} on green run (${why}).`);
            return;
          }

          // ────────────────────────────────────────────────────────────────
          if (MODE === "branch-gone") {
            if (!GONE_BRANCH) { core.info("No branch to reconcile."); return; }
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            const matches = openIssues.filter((i) => {
              const m = (i.body ?? "").match(/<!-- d3-ci-failure:(.+):(.+?) -->/);
              return m && m[2] === GONE_BRANCH;
            });
            if (!matches.length) {
              core.info(`No ci-failure issues for branch ${GONE_BRANCH}.`);
              return;
            }

            let reason, stateReason;
            if (TRIGGER === "delete") {
              reason = `branch \`${GONE_BRANCH}\` was deleted`;
              stateReason = "not_planned";
            } else {
              // pull_request closed. GOL-1317: a PR closed UNMERGED whose branch
              // still exists leaves the failure live — do NOT close then.
              if (PR_MERGED === "true") {
                reason = `the PR for \`${GONE_BRANCH}\` was merged`;
                stateReason = "completed";
              } else {
                let exists = true;
                try {
                  await github.rest.repos.getBranch({ owner, repo, branch: GONE_BRANCH });
                } catch (e) {
                  if (e.status === 404) exists = false; else throw e;
                }
                if (exists) {
                  core.info(`PR for ${GONE_BRANCH} closed unmerged but the branch still exists; leaving ${matches.length} issue(s) open.`);
                  return;
                }
                reason = `the PR for \`${GONE_BRANCH}\` was closed unmerged and the branch was deleted`;
                stateReason = "not_planned";
              }
            }

            for (const m of matches) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: m.number,
                body: `🧹 Auto-closed — ${reason}, so this CI-failure issue is stale.\n\n_Auto-closed by the CI failure router._`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: m.number,
                state: "closed", state_reason: stateReason,
              });
              core.info(`Closed #${m.number} (${reason}).`);
            }
            return;
          }

          // ────────────────────────────────────────────────────────────────
          if (MODE === "sweep") {
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            let closed = 0;
            for (const issue of openIssues) {
              const m = (issue.body ?? "").match(/<!-- d3-ci-failure:(.+):(.+?) -->/);
              if (!m) continue;
              const branch = m[2];
              // Long-lived branches always exist; their failures are real.
              if (["main", "master", "develop"].includes(branch)) continue;
              let exists = true;
              try {
                await github.rest.repos.getBranch({ owner, repo, branch });
              } catch (e) {
                if (e.status === 404) exists = false; else throw e;
              }
              if (exists) continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `🧹 Auto-closed by sweep — branch \`${branch}\` no longer exists.\n\n_Auto-closed by the CI failure router._`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: "closed", state_reason: "not_planned",
              });
              closed++;
              core.info(`Swept #${issue.number} (branch ${branch} gone).`);
            }
            core.info(`Sweep closed ${closed} issue(s).`);
            return;
          }

          // ────────────────────────────────────────────────────────────────
          // GOL-1958: detect required checks that never STARTED on an open PR.
          if (MODE === "missing-checks") {
            const graceMin = Number(GRACE_MINUTES || "20");
            const nowMs = Date.now();

            // Declared required contexts + the protected branch they gate,
            // read from the repo file.
            let declaredContexts = [];
            let baseBranch = null;
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: ".github/required-checks.json",
              });
              const json = JSON.parse(Buffer.from(file.content, "base64").toString("utf8"));
              declaredContexts = json.required_contexts || [];
              baseBranch = json.branch || null;
            } catch (e) {
              core.warning(`No readable .github/required-checks.json (${e.status}); nothing to sweep.`);
              return;
            }
            if (!declaredContexts.length || !baseBranch) {
              core.info("No required contexts declared; nothing to sweep.");
              return;
            }

            // Intersect the DECLARED set with the LIVE-enforced required checks
            // for the base branch (GOL-2004). A PR can only wedge at "Expected —
            // waiting for status" on a check that branch protection actually
            // enforces; a context that is declared-required but NOT live-required
            // (e.g. a `pull_request: paths:`-filtered workflow like
            // `Required-checks audit` that legitimately doesn't run on code-only
            // PRs) is absent on the head SHA forever yet blocks nothing — flagging
            // it mints a spurious `ci-failure` issue + a useless close/reopen on
            // every unrelated PR. `GET /repos/{o}/{r}/rules/branches/{branch}`
            // returns the effective rules and needs only repo READ (NOT the
            // admin-scoped branch-protection / rulesets endpoints), so it is safe
            // in a frequent sweep. Declared-vs-live *drift* is still owned by the
            // required-checks-audit reconcile leg; this only narrows what the
            // sweep treats as wedge-capable. On any read failure we fall back to
            // the declared set (fail-open: never lose dropped-trigger detection).
            let requiredContexts = declaredContexts;
            try {
              const { data: rules } = await github.request(
                "GET /repos/{owner}/{repo}/rules/branches/{branch}",
                { owner, repo, branch: baseBranch },
              );
              const live = new Set();
              for (const r of rules || []) {
                if (r.type !== "required_status_checks") continue;
                for (const c of r.parameters?.required_status_checks || []) {
                  if (c.context) live.add(c.context);
                }
              }
              if (live.size) {
                const enforced = declaredContexts.filter((c) => live.has(c));
                const dropped = declaredContexts.filter((c) => !live.has(c));
                if (dropped.length) {
                  core.info(`Declared-but-not-live-required (skipped, cannot wedge): [${dropped.join(", ")}]`);
                }
                requiredContexts = enforced;
              } else {
                core.warning(`No live required_status_checks rule on ${baseBranch}; falling back to declared set.`);
              }
            } catch (e) {
              core.warning(`Could not read live branch rules for ${baseBranch} (${e.status}); falling back to declared set.`);
            }
            if (!requiredContexts.length) {
              core.info("No live-enforced required contexts to sweep.");
              return;
            }

            // Open, non-draft PRs targeting the protected branch.
            const allOpen = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", base: baseBranch, per_page: 100,
            });
            const prs = allOpen.filter((p) => !p.draft);
            const evaluated = new Set(prs.map((p) => p.number));

            // Dedup markers (one issue per PR; body records the head SHA so a
            // re-run for the same PR+SHA is a strict no-op — acceptance #5).
            const marker = (num) => `<!-- d3-missing-checks:PR${num} -->`;
            const DATA_RE = /<!-- d3-missing-checks-data:(\{.*?\}) -->/;
            const dataMarker = (sha) =>
              `<!-- d3-missing-checks-data:${JSON.stringify({ sha: sha || "" })} -->`;
            const recordedSha = (body) => {
              const m = (body ?? "").match(DATA_RE);
              if (m) { try { return JSON.parse(m[1]).sha; } catch { /* */ } }
              return null;
            };

            // These sweeps mint `ci-failure`-labelled issues so the GitHub App
            // mirrors them to Paperclip — same notification path as the router.
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            const missingIssueFor = (num) =>
              openIssues.find((i) => (i.body ?? "").includes(marker(num)));

            const flagged = new Set(); // PR numbers currently flagged

            for (const pr of prs) {
              const sha = pr.head.sha;

              // Union of check-run NAMES and commit-status CONTEXTS on the head
              // SHA. grove-sites' `Lighthouse CI` is a commit status, not a
              // check-run — reading only check-runs would false-positive it
              // (acceptance #3). A context in ANY state (queued/in_progress/
              // completed) counts as present, so queued work is never flagged
              // (acceptance #4).
              const present = new Set();
              const crResp = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100,
              });
              for (const cr of crResp.data.check_runs || []) present.add(cr.name);
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                { owner, repo, ref: sha, per_page: 100 },
              );
              for (const s of statuses) present.add(s.context);

              const missing = requiredContexts.filter((c) => !present.has(c));
              if (!missing.length) continue;

              // Grace: only flag once the head SHA is older than the window in
              // which GitHub would normally have created queued check-runs.
              let commitDate = null;
              try {
                const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
                commitDate = commit.commit.committer?.date || commit.commit.author?.date || null;
              } catch (e) {
                core.info(`PR #${pr.number}: cannot read head commit (${e.status}); skipping to avoid a false positive.`);
                continue;
              }
              if (!commitDate) continue;
              const ageMin = (nowMs - new Date(commitDate).getTime()) / 60000;
              if (ageMin < graceMin) {
                core.info(`PR #${pr.number}: head ${sha.slice(0, 7)} is ${ageMin.toFixed(1)}m old (< ${graceMin}m grace); missing [${missing.join(", ")}] — within queue window, skipping.`);
                continue;
              }

              flagged.add(pr.number);

              // Why is the context absent? Two causes look IDENTICAL from
              // check-runs + statuses alone, because a workflow run parked at
              // `action_required` publishes neither (GOL-2732):
              //   (a) dropped trigger  — GitHub never created the run.
              //   (b) approval gate    — the run exists but is held pending a
              //       maintainer's "Approve and run". GitHub does this when the
              //       triggering actor is `github-actions[bot]`, i.e. the head
              //       was moved by something wielding the ambient GITHUB_TOKEN
              //       (a stacked PR merged into this PR's branch, a bot-opened
              //       PR — same family as GOL-2504 / GOL-2114 / GOL-2524).
              // Distinguishing them matters: (a) and (b) share the close/reopen
              // fix, but (b) needs the *identity* named or it recurs on the
              // next bot-driven head move.
              // GOL-2802: do NOT offer "Approve and run" as the primary remedy
              // for (b). Approving/re-running a gated run greens the contexts
              // but leaves the run's `actor` as `github-actions[bot]` (only
              // `triggering_actor` flips to the approver), so events chained off
              // it stay suppressed — including the `workflow_run` trigger of
              // auto-approve.yml. A head move that gated CI also dismissed the
              // bot approval, so the PR then sits at REVIEW_REQUIRED, all-green
              // and silent. Close/reopen re-parents the chain and fixes both.
              let gated = [];
              let gatedActors = [];
              try {
                const runsResp = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, head_sha: sha, per_page: 100,
                });
                gated = (runsResp.data.workflow_runs || []).filter(
                  (r) => r.conclusion === "action_required",
                );
                gatedActors = [...new Set(
                  gated.map((r) => r.triggering_actor?.login || r.actor?.login).filter(Boolean),
                )];
              } catch (e) {
                // `actions: read` missing, or the API is unhappy — fall back to
                // the dropped-trigger wording rather than dropping the issue.
                core.info(`PR #${pr.number}: cannot list workflow runs for ${sha.slice(0, 7)} (${e.status}); reporting without approval-gate detection.`);
              }

              // Cause (c): the PR's BASE was retargeted after this head was
              // pushed (GOL-2850). A `pull_request` workflow filtered by
              // `branches: [main]` is matched against the base AT EVENT TIME,
              // so a stacked PR (base = a topic branch) legitimately gets no
              // CI while it is stacked. When the parent merges, GitHub
              // retargets the child onto the protected branch
              // (`automatic_base_change_succeeded`) — but a base change fires
              // neither `opened`, `synchronize` nor `reopened`, so the
              // branch-filtered workflows never get a second chance and the
              // contexts stay absent on an unchanged head forever.
              // NOT a dropped trigger: nothing was lost, the event was
              // correctly filtered. The PR wedges identically, but saying
              // "dropped trigger" sends triage hunting a phantom GitHub fault
              // instead of recognising the stacked-PR class.
              let retargetedAt = null;
              if (!gated.length) {
                try {
                  const events = await github.paginate(
                    github.rest.issues.listEventsForTimeline,
                    { owner, repo, issue_number: pr.number, per_page: 100 },
                  );
                  const headMs = new Date(commitDate).getTime();
                  const after = (events || [])
                    .filter(
                      (e) =>
                        e.event === "automatic_base_change_succeeded" ||
                        e.event === "base_ref_changed",
                    )
                    .map((e) => e.created_at)
                    .filter((t) => t && new Date(t).getTime() > headMs)
                    .sort();
                  if (after.length) retargetedAt = after[after.length - 1];
                } catch (e) {
                  // Timeline unreadable — fall back to the dropped-trigger
                  // wording rather than dropping the issue.
                  core.info(`PR #${pr.number}: cannot read timeline (${e.status}); reporting without retarget detection.`);
                }
              }
              const diagnosis = gated.length
                ? [
                    `These contexts are **required** by branch protection (\`.github/required-checks.json\`, branch \`${baseBranch}\`) but publish no check-run and no commit status, because **${gated.length} workflow run(s) on this head are parked at \`action_required\`** — held for a maintainer's "Approve and run". This is an **approval gate, not a dropped trigger**.`,
                    "",
                    `**Gated run(s):** ${gated.map((r) => `[${r.name}](${r.html_url})`).join(", ")}`,
                    gatedActors.length
                      ? `**Triggering actor:** ${gatedActors.map((a) => `\`${a}\``).join(", ")}${gatedActors.includes("github-actions[bot]") ? " — the ambient `GITHUB_TOKEN`. GitHub will not auto-run workflows for events it triggers, so **every** head move made under that identity re-gates this PR. Fix the automation that moved the head to push/merge as the GitHub App instead (see GOL-2504, GOL-2114, GOL-2524)." : ""}`
                      : "",
                  ].filter(Boolean).join("\n")
                : retargetedAt
                ? [
                    `These contexts are **required** by branch protection (\`.github/required-checks.json\`, branch \`${baseBranch}\`) but have **no check-run and no commit status of any state** on the head SHA, and no workflow run on this head is awaiting approval — because this PR's **base was retargeted at ${retargetedAt}, AFTER its head commit (${commitDate})**.`,
                    "",
                    `A \`pull_request\` workflow filtered by \`branches: [${baseBranch}]\` is matched against the base **at event time**. When this head was pushed the base was a different branch (the usual cause: a stacked PR whose parent has since merged), so those workflows were correctly skipped. A base change fires neither \`opened\`, \`synchronize\` nor \`reopened\`, so they never get a second chance on this head.`,
                    "",
                    "This is a **filtered trigger that will never re-fire, not a dropped one** — GitHub lost nothing. The PR wedges identically, and the fix is the same.",
                  ].join("\n")
                : `These contexts are **required** by branch protection (\`.github/required-checks.json\`, branch \`${baseBranch}\`) but have **no check-run and no commit status of any state** on the head SHA, and no workflow run on this head is awaiting approval. That is a dropped trigger, not a slow run — the PR will hang at "Expected — waiting for status" until it is cleared.`;

              const remediation = [
                gated.length
                  ? "**Remediation** — close and reopen the PR so the whole `pull_request` event re-fires under a non-`GITHUB_TOKEN` identity (plain PR permissions; no `actions: write` needed):"
                  : retargetedAt
                    ? "**Remediation** — close and reopen the PR. `reopened` is a `pull_request` event matched against the PR's *current* base, so the branch-filtered workflows run this time:"
                    : "**Remediation** — the reliable way to regenerate a dropped `pull_request` event is to close and reopen the PR:",
                "```bash",
                `gh pr close ${pr.number} --repo ${owner}/${repo} && gh pr reopen ${pr.number} --repo ${owner}/${repo}`,
                "```",
                "Close/reopen re-fires `pull_request` on the **same head SHA** (nothing rebinds), so the missing workflow(s) run on the current head. This is a mutating action on the PR — safe for an agent-authored PR, but check first that no auto-merge is armed (closing disarms it) and that no human is mid-review; if one is, coordinate first (GOL-1958 keeps auto-remediation out of scope for now).",
                gated.length
                  ? "⚠️ **Approving the gated run(s) from the Actions tab is only a HALF fix** (GOL-2802). It does turn the required contexts green, but a re-run keeps the run's `actor` as `github-actions[bot]` — only `triggering_actor` becomes the approver — so every event chained off that run stays suppressed, including the `workflow_run` trigger `auto-approve.yml` listens on. When the same bot head move also dismissed an approving review (`dismiss_stale_reviews_on_push`), nothing restores it: the PR then sits at `REVIEW_REQUIRED` with every check green and no red signal anywhere. Close/reopen re-parents the whole event chain and clears both at once. On a **human's** PR, do not close/reopen it for them — a maintainer's approving review also re-fires `auto-approve.yml` via its `pull_request_review` entrypoint."
                  : "",
              ].filter(Boolean).join("\n");
              const summary = [
                `**PR:** [#${pr.number} — ${pr.title}](${pr.html_url})`,
                `**Head SHA:** \`${sha}\` (age ${ageMin.toFixed(0)}m, past the ${graceMin}m grace window)`,
                `**Missing required context(s):** ${missing.map((c) => `\`${c}\``).join(", ")}`,
                "",
                diagnosis,
                "",
                remediation,
              ].join("\n");

              const existing = missingIssueFor(pr.number);
              if (existing) {
                if (recordedSha(existing.body) === sha) {
                  core.info(`PR #${pr.number}: issue #${existing.number} already open for head ${sha.slice(0, 7)} — no-op (dedup).`);
                  continue;
                }
                // Head advanced but the context is still missing — keep one
                // issue, refresh its recorded SHA, add a note.
                const oldBody = existing.body ?? "";
                const newBody = DATA_RE.test(oldBody)
                  ? oldBody.replace(DATA_RE, dataMarker(sha))
                  : `${oldBody}\n${dataMarker(sha)}`;
                if (newBody !== oldBody) {
                  await github.rest.issues.update({
                    owner, repo, issue_number: existing.number, body: newBody,
                  });
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Head advanced to \`${sha}\` and the required context(s) are still missing.\n\n${summary}`,
                });
                core.info(`Updated missing-checks issue #${existing.number} for PR #${pr.number}.`);
              } else {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: "ci-failure", color: "b60205",
                    description: "Minted by the CI failure router",
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                }
                const body = [
                  marker(pr.number),
                  dataMarker(sha),
                  summary,
                  "",
                  "_Filed by the CI failure router (missing-required-check sweep, GOL-1958); mirrored to Paperclip for analysis._",
                ].join("\n");
                const { data: issue } = await github.rest.issues.create({
                  owner, repo,
                  title: `${gated.length ? "Approval-gated" : retargetedAt ? "Retarget-skipped" : "Missing"} required check on PR #${pr.number}: ${missing.join(", ")}`,
                  body, labels: ["ci-failure"],
                });
                core.info(`Minted missing-checks issue #${issue.number} for PR #${pr.number}.`);
              }
            }

            // Self-heal: close any open missing-checks issue whose PR is no
            // longer flagged — the checks now report, or the PR left the set
            // (closed / drafted / retargeted).
            for (const issue of openIssues) {
              const m = (issue.body ?? "").match(/<!-- d3-missing-checks:PR(\d+) -->/);
              if (!m) continue;
              const num = Number(m[1]);
              if (flagged.has(num)) continue;
              const reason = evaluated.has(num)
                ? `all required contexts now report on PR #${num}'s head`
                : `PR #${num} is no longer an open non-draft PR on \`${baseBranch}\``;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `✅ Resolved — ${reason}.\n\n_Auto-closed by the missing-required-check sweep._`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: "closed", state_reason: "completed",
              });
              core.info(`Closed missing-checks issue #${issue.number} (${reason}).`);
            }
            return;
          }

          core.setFailed(`Unknown mode: ${MODE}`);
